  ctx.fillStyle = '#0e0a0a'; ctx.fillRect(fx - 2, pl.y - 64, 5, 64);
  ctx.fillStyle = '#d9d0c4'; ctx.fillRect(fx - 1, pl.y - 63, 3, 62);
  const wv = Math.sin(S.t / 10) * 4;
  ctx.fillStyle = '#d62828'; ctx.beginPath(); ctx.moveTo(fx + 2, pl.y - 62); ctx.quadraticCurveTo(fx + 20, pl.y - 58 + wv, fx + 36, pl.y - 52); ctx.lineTo(fx + 2, pl.y - 42); ctx.fill();
}

// Fondo nocturno: cielo, estrellas, luna, nubes y ciudad a lo lejos (con paralaje)
function drawNightBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#060b1c'); g.addColorStop(0.55, '#0d1838'); g.addColorStop(1, '#18264d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) {
    const x = hash(i, 3) * W, y = ((hash(i, 7) * H * 1.6 - S.camY * 0.05) % H + H) % H;
    ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(S.t / 40 + i));
    ctx.fillStyle = '#dfe8ff'; ctx.fillRect(x, y, 1.6, 1.6);
  }
  ctx.globalAlpha = 1;
  const my = 120 - S.camY * 0.04, mx = W / 2 - 40;
  const halo = ctx.createRadialGradient(mx, my, 30, mx, my, 140);
  halo.addColorStop(0, 'rgba(220,230,255,0.35)'); halo.addColorStop(1, 'rgba(220,230,255,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, 140, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8ecf5'; ctx.beginPath(); ctx.arc(mx, my, 50, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(170,180,205,0.35)';
  for (const [dx, dy, r] of [[-16, -10, 10], [14, 8, 13], [-6, 20, 7], [20, -18, 6]]) { ctx.beginPath(); ctx.arc(mx + dx, my + dy, r, 0, 7); ctx.fill(); }
  const cloud = (cx, cy, k) => {
    ctx.fillStyle = 'rgba(26,38,74,0.9)';
    for (const [dx, dy, r] of [[0, 0, 26], [28, -10, 22], [54, 0, 24], [-26, 6, 18], [80, 8, 16]]) { ctx.beginPath(); ctx.arc(cx + dx * k, cy + dy * k, r * k, 0, 7); ctx.fill(); }
  };
  cloud(((S.t * 0.15) % (W + 260)) - 140, my + 30, 1);
  cloud(((S.t * 0.08 + 260) % (W + 300)) - 160, 300 - S.camY * 0.06, 1.3);
  const city = (k, base, col, win, seed) => {
    const off = -S.camY * k;
    for (let i = 0; i < 9; i++) {
      const bw = 40 + hash(i, seed) * 40, bh = 120 + hash(i, seed + 1) * 220, bx = i * 48 - 20, by = base + off - bh;
      if (by > H) continue;
      ctx.fillStyle = col; ctx.fillRect(bx, by, bw, H - by + 400);
      ctx.fillStyle = win;
      for (let wy = by + 12; wy < Math.min(H, base + off); wy += 18)
        for (let wx = bx + 6; wx < bx + bw - 8; wx += 12)
          if (hash(wx + seed, wy - off) > 0.72) ctx.fillRect(wx, wy, 5, 7);
    }
  };
  city(0.12, H + 40, '#131d3a', 'rgba(255,214,120,0.32)', 11);
  city(0.22, H + 160, '#0b1329', 'rgba(255,200,100,0.5)', 23);
}

// Los dos troncos (izquierdo y derecho) en coordenadas del mundo, con raíces abajo y matas de hojas pegadas
function drawTrunks() {
  const top = Math.max(S.goalPlaced ? S.roofY - 60 : -1e9, S.camY - 40), bot = Math.min(H + 30, S.camY + H + 40);
  if (bot <= top) return;
  for (const side of ['L', 'R']) {
    const im = TREE['bark' + side], x0 = side === 'L' ? TRUNK_W - im.width : W - TRUNK_W;
    ctx.save(); ctx.beginPath(); ctx.rect(x0, top, im.width, bot - top); ctx.clip();
    for (let y = Math.floor(top / im.height) * im.height; y < bot; y += im.height) ctx.drawImage(im, x0, y);
    ctx.restore();
    // borde con contorno y sombra que el tronco proyecta hacia adentro
    const ex = side === 'L' ? TRUNK_W : W - TRUNK_W, dir = side === 'L' ? 1 : -1;
    const sh = ctx.createLinearGradient(ex, 0, ex + dir * 16, 0);
    sh.addColorStop(0, 'rgba(0,0,0,0.35)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh; ctx.fillRect(Math.min(ex, ex + dir * 16), top, 16, bot - top);
    ctx.fillStyle = '#0d0703'; ctx.fillRect(ex - 2, top, 3, bot - top);
    // matas de hojas que brotan del tronco
    for (let k = Math.floor(top / 230) - 1; k <= Math.ceil(bot / 230); k++) {
      if (hash(k, side === 'L' ? 31 : 37) < 0.45) continue;
      const ly = k * 230 + hash(k, 41) * 90;
      drawLeaves(ex + dir * 6, ly, 64, k + (side === 'L' ? 0 : 3));
    }
  }
  // raíces que se abren sobre el pasto
  if (S.camY > -140) for (const side of [-1, 1]) {
    const ex = side < 0 ? TRUNK_W : W - TRUNK_W;
    for (const [dx, h] of [[22, 30], [44, 18], [10, 40]]) {
      ctx.fillStyle = '#0d0703';
      ctx.beginPath(); ctx.moveTo(ex, H - 20 - h - 2); ctx.quadraticCurveTo(ex - side * dx * 0.2, H - 24, ex - side * dx - side * 4, H - 18); ctx.lineTo(ex, H - 18); ctx.fill();
      ctx.fillStyle = '#5a361d';
      ctx.beginPath(); ctx.moveTo(ex, H - 20 - h); ctx.quadraticCurveTo(ex - side * dx * 0.2, H - 24, ex - side * dx, H - 20); ctx.lineTo(ex, H - 20); ctx.fill();
    }
  }
}

// Rama: sale del tronco (más gruesa) y se afina hacia la punta; arriba es plana para pararse
function drawBranch(pl) {
  const left = pl.side < 0, dir = left ? 1 : -1;
  if (pl.fragile && pl.broken) { drawBrokenBranch(pl); return; }
  if (pl.fragile && pl.crackT) {   // cruje: tiembla y se dobla hacia abajo
    const k = Math.min(1, pl.crackT / (pl.crackMax || 24)), xb0 = left ? pl.x : pl.x + pl.w;
    ctx.save(); ctx.translate(xb0 + rand(-1, 1) * k * 2, pl.y); ctx.rotate(dir * k * 0.12); ctx.translate(-xb0, -pl.y);
    drawBranchBody(pl, left, dir); ctx.restore(); return;
  }
  drawBranchBody(pl, left, dir);
}

// Muñón que queda pegado al tronco cuando una rama seca se quiebra
function drawBrokenBranch(pl) {
  const left = pl.side < 0, dir = left ? 1 : -1, xb = left ? pl.x : pl.x + pl.w, y = pl.y, L = 22;
  ctx.fillStyle = '#0d0703';
  ctx.beginPath(); ctx.moveTo(xb, y - 6); ctx.lineTo(xb + dir * (L + 2), y - 2); ctx.lineTo(xb + dir * (L - 6), y + 6);
  ctx.lineTo(xb + dir * (L + 4), y + 12); ctx.lineTo(xb + dir * 8, y + 22); ctx.lineTo(xb, y + 30); ctx.fill();
  ctx.fillStyle = '#6e5a44';
  ctx.beginPath(); ctx.moveTo(xb, y - 3); ctx.lineTo(xb + dir * L, y); ctx.lineTo(xb + dir * (L - 7), y + 6);
  ctx.lineTo(xb + dir * (L + 1), y + 11); ctx.lineTo(xb + dir * 7, y + 19); ctx.lineTo(xb, y + 26); ctx.fill();
  ctx.fillStyle = '#c9a77a'; ctx.fillRect(xb + dir * (L - 4) - (dir < 0 ? 3 : 0), y + 2, 3, 8);   // madera clara de la quebradura
}

function drawBranchBody(pl, left, dir) {
  const xb = left ? pl.x : pl.x + pl.w, xt = left ? pl.x + pl.w : pl.x, y = pl.y;
  const t0 = 21, t1 = 11, seed = Math.floor(Math.abs(pl.x * 13 + pl.y * 7)) % 97;
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(xb, y - 4);
    ctx.lineTo(xt - dir * 6, y);
    ctx.quadraticCurveTo(xt + dir * 3, y + t1 / 2, xt - dir * 6, y + t1);   // punta redondeada
    ctx.quadraticCurveTo((xb + xt) / 2, y + t1 + 3, xb + dir * 16, y + t0);
    ctx.quadraticCurveTo(xb + dir * 4, y + t0 + 2, xb, y + t0 + 14);         // cuello que se ensancha al tronco
    ctx.closePath();
  };
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse((xb + xt) / 2, y + t0 + 6, Math.abs(xt - xb) / 2, 5, 0, 0, 7); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#0d0703'; path(); ctx.stroke();
  const dry = pl.fragile, g = ctx.createLinearGradient(0, y - 4, 0, y + t0);
  if (dry) { g.addColorStop(0, '#a99a84'); g.addColorStop(0.3, '#7a6a56'); g.addColorStop(1, '#3d342a'); }
  else { g.addColorStop(0, '#b0804f'); g.addColorStop(0.3, '#7d4f2c'); g.addColorStop(1, '#3a2110'); }
  ctx.fillStyle = g; path(); ctx.fill();
  if (dry) {   // grietas de rama seca
    ctx.strokeStyle = '#1a120a'; ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (const f of [0.35, 0.68]) {
      const cx = xb + (xt - xb) * f;
      ctx.moveTo(cx, y - 1); ctx.lineTo(cx + dir * 3, y + 5); ctx.lineTo(cx - dir * 2, y + 9); ctx.lineTo(cx + dir * 2, y + 14);
    }
    ctx.stroke();
  }
  // vetas a lo largo de la rama y brillo de luna arriba
  ctx.strokeStyle = 'rgba(25,12,5,0.55)'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(xb + dir * 6, y + 7); ctx.quadraticCurveTo((xb + xt) / 2, y + 4, xt - dir * 12, y + 5);
  ctx.moveTo(xb + dir * 10, y + 13); ctx.quadraticCurveTo((xb + xt) / 2, y + 10, xt - dir * 18, y + 8);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(225,195,150,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(xb + dir * 4, y - 2.5); ctx.lineTo(xt - dir * 8, y + 1); ctx.stroke();
  // nudito y ramita que sube con hojas cerca de la punta
  ctx.fillStyle = '#2a170a'; ctx.beginPath(); ctx.ellipse((xb + xt) / 2 + dir * 8, y + 9, 3, 2, 0, 0, 7); ctx.fill();
  const tx = xt - dir * 18;
  if (pl.fragile) {   // hojas secas en la punta
    ctx.globalAlpha = 0.95; ctx.filter = 'sepia(0.9) saturate(0.7) brightness(0.8)';
    drawLeaves(xt + dir * 16, y - 4, 52, seed);
    ctx.filter = 'none'; ctx.globalAlpha = 1;
    return;
  }
  ctx.strokeStyle = '#0d0703'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(tx, y + 2); ctx.lineTo(tx + dir * 10, y - 16); ctx.stroke();
  ctx.strokeStyle = '#7d4f2c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tx, y + 2); ctx.lineTo(tx + dir * 10, y - 16); ctx.stroke();
  // follaje: en la punta (por fuera de donde se pisa) y colgando bajo la rama
  drawLeaves(xt + dir * 20, y - 6, 78, seed);
  drawLeaves(tx + dir * 12, y - 22, 40, seed + 1);
  drawLeaves((xb + xt) / 2 - dir * 6, y + t0 + 8, 46, seed + 2);
  // enredadera que cuelga en algunas ramas
  if (seed % 3 === 0) {
    const vx = (xb + xt) / 2 + dir * 14;
    ctx.strokeStyle = '#1c4a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(vx, y + t1 + 2);
    for (let k = 1; k <= 6; k++) ctx.lineTo(vx + Math.sin(k * 1.3 + S.t / 50) * 4, y + t1 + 2 + k * 9);
    ctx.stroke();
    ctx.fillStyle = '#3a8a34';
    for (let k = 1; k <= 6; k += 1) leafShape(ctx, vx + Math.sin(k * 1.3 + S.t / 50) * 4 + (k % 2 ? 4 : -4), y + t1 + 2 + k * 9, 8, k % 2 ? 0.6 : -0.6);
  }
}

// Suelo de pasto con arbustos al pie del árbol
function drawGrass() {
  const g = ctx.createLinearGradient(0, H - 20, 0, H + 60);
  g.addColorStop(0, '#173d18'); g.addColorStop(1, '#081a0a');
  ctx.fillStyle = g; ctx.fillRect(0, H - 20, W, 220);
  ctx.fillStyle = '#2a6424'; ctx.fillRect(0, H - 20, W, 4);
  for (let x = 0; x < W; x += 5) {
    const h = 4 + hash(x, 1) * 8;
    ctx.fillStyle = hash(x, 2) > 0.5 ? '#2f7027' : '#3f8a32'; ctx.fillRect(x, H - 20 - h, 2, h);
  }
  drawLeaves(W / 2 - 70, H - 30, 70, 2); drawLeaves(W / 2 + 60, H - 28, 60, 4);
}

// Copa del árbol: la meta del módulo (una rama gruesa de tronco a tronco cubierta de hojas)
function drawCanopy(pl) {
  for (let i = 0; i < 8; i++) drawLeaves(i * 58 - 4, pl.y - 26 - (i % 2) * 16, 110, i);
  ctx.fillStyle = '#0d0703'; ctx.fillRect(-20, pl.y - 3, W + 40, 22);
  const g = ctx.createLinearGradient(0, pl.y, 0, pl.y + 18);
  g.addColorStop(0, '#b0804f'); g.addColorStop(0.35, '#7d4f2c'); g.addColorStop(1, '#3a2110');
  ctx.fillStyle = g; ctx.fillRect(-20, pl.y, W + 40, 17);
  for (let i = 0; i < 7; i++) drawLeaves(i * 66 + 20, pl.y + 26, 64, i + 3);
}

// En el árbol, cada rama se estira hasta el tronco más cercano
function treeify(p) {
  const tip0 = p.x, tip1 = p.x + p.w, ww = wallW();
  if (tip0 + p.w / 2 < W / 2) { p.side = -1; p.x = ww - 6; p.w = tip1 - p.x; }
  else { p.side = 1; p.w = W - ww + 6 - tip0; }
}
// Rectángulo que ocupará una rama candidata ya estirada hasta su tronco
const treeRect = (x, w) => x + w / 2 < W / 2 ? { x: wallW() - 6, w: x + w - wallW() + 6 } : { x, w: W - wallW() + 6 - x };

function drawBg() {
  if (theme() === 'tree') { drawNightBg(); return; }
  if (theme() === 'forest') { drawForestBg(); return; }
  const deep = clamp(-S.camY / 6000, 0, 1);
  ctx.fillStyle = '#1c1c20';
  ctx.fillRect(0, 0, W, H);
  // Ladrillos oscuros con leve variación de tono
  const BH = 16, BW = 40;
  const r0 = Math.floor(S.camY / BH) - 1;
  for (let r = r0; r < r0 + H / BH + 3; r++) {
    const y = r * BH - S.camY;
    const sh = (r & 1) ? BW / 2 : 0;
    for (let c = -1; c < W / BW + 1; c++) {
      const x = c * BW - sh, h = hash(c, r);
      let v = 40 + Math.floor(h * 9) - deep * 8;
      let rr = v, gg = v, bb = v + 4;
      if (h > 0.985) { rr += 12; gg += 3; }          // algún ladrillo rojizo
      else if (h < 0.05) { rr -= 8; gg -= 8; bb -= 8; } // alguno más oscuro
      ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      ctx.fillRect(x + 1, y + 1, BW - 2, BH - 2);
    }
  }
  if (S.phase === 2) {
    ctx.fillStyle = `rgba(255,70,0,${0.05 + Math.sin(S.t / 20) * 0.025})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// Adornos de la fachada: cañerías, rejillas y cajas eléctricas (en coordenadas del mundo)
function drawDecor() {
  const BAND = 320;
  const b0 = Math.floor(S.camY / BAND) - 1;
  for (let b = b0; b < b0 + H / BAND + 3; b++) {
    const y0 = b * BAND;
    if (S.goalPlaced && y0 < S.roofY) continue;
    // Cañerías verticales en los bordes
    for (const [side, px] of [[0, 14], [1, W - 14]]) {
      if (hash(b, side + 7) < 0.55) {
        ctx.fillStyle = '#111'; ctx.fillRect(px - 5, y0, 10, BAND);
        ctx.fillStyle = '#3c4250'; ctx.fillRect(px - 4, y0, 8, BAND);
        ctx.fillStyle = '#5b6273'; ctx.fillRect(px - 2, y0, 2, BAND);
        for (let k = 30; k < BAND; k += 110) {
          ctx.fillStyle = '#111'; ctx.fillRect(px - 7, y0 + k - 1, 14, 8);
          ctx.fillStyle = '#4c5363'; ctx.fillRect(px - 6, y0 + k, 12, 6);
        }
      }
    }
    // Rejillas y cajas
    for (let n = 0; n < 2; n++) {
      const x = 40 + hash(b, n + 20) * (W - 90), y = y0 + 30 + hash(b, n + 30) * (BAND - 60);
      if (hash(b, n + 40) < 0.5) {
        ctx.fillStyle = '#111'; ctx.fillRect(x - 1, y - 1, 26, 24);
        ctx.fillStyle = '#3a3f4a'; ctx.fillRect(x, y, 24, 22);
        ctx.fillStyle = '#15171c';
        for (let k = 4; k < 20; k += 5) ctx.fillRect(x + 4, y + k, 16, 3);
      } else {
        ctx.fillStyle = '#111'; ctx.fillRect(x - 1, y - 1, 16, 16);
        ctx.fillStyle = '#4a4f5a'; ctx.fillRect(x, y, 14, 14);
        ctx.fillStyle = '#5d6370'; ctx.fillRect(x + 2, y + 2, 10, 2);
      }
    }
  }
}

function drawWorld() {
  if (theme() === 'tree') {
    if (S.camY > -100) drawGrass();
    drawTrunks();
  }
  if (theme() === 'forest') {
    if (S.camY > -100) drawForestGround();
    S.plats.filter(pl => !pl.ground && !pl.roof && pl.y > S.camY - 260 && pl.y < S.camY + H + 40)
      .sort((a, b) => a.y - b.y).forEach(drawCliffBody);
  }
  // Cielo sobre la azotea
  if (!theme() && S.goalPlaced && S.roofY > S.camY - 50) {
    const g = ctx.createLinearGradient(0, S.camY, 0, S.roofY);
    g.addColorStop(0, '#0b1a3a'); g.addColorStop(1, '#2d4a7a');
    ctx.fillStyle = g;
    ctx.fillRect(0, S.camY - 20, W, S.roofY - S.camY + 20);
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 30; i++) ctx.fillRect((i * 137) % W, S.roofY - 40 - ((i * 89) % 600), 2, 2);
  }

  // Calle y carro bomba al inicio
  if (!theme() && S.camY > -100) {
    ctx.fillStyle = '#333'; ctx.fillRect(0, H - 20, W, 200);
    ctx.fillStyle = '#555'; ctx.fillRect(0, H - 20, W, 3);   // borde de la vereda
    // Carro bomba estacionado
    const tr = IMG.camion;
    if (tr && tr.complete && tr.naturalWidth) {
      const tw = 210, th = tw * tr.naturalHeight / tr.naturalWidth;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(W - 10 - tw / 2, H - 17, tw / 2, 5, 0, 0, 7); ctx.fill();
      ctx.drawImage(tr, W - 10 - tw, H - 15 - th, tw, th);
    }
  }

  if (!theme()) drawDecor();
  for (const pl of S.plats) {
    if (pl.ground) continue;
    if (pl.kind === 'slab' || pl.kind === 'stairstep') continue;   // los dibuja el techo de la escalera
    if (pl.kind === 'landing') { drawSill(pl.x, pl.y, pl.w); continue; }
    if (pl.kind === 'ventroof') { drawVentRoof(pl); continue; }
    if (theme() === 'tree') { if (pl.roof) drawCanopy(pl); else drawBranch(pl); continue; }
    if (theme() === 'forest') { if (pl.roof) drawSummit(pl); else drawLedge(pl); continue; }
    if (pl.roof) {
      ctx.fillStyle = '#777'; ctx.fillRect(pl.x, pl.y, pl.w, 20);
      ctx.fillStyle = '#999'; ctx.fillRect(pl.x, pl.y, pl.w, 3);
    } else drawRoof(pl);
  }

  for (const it of S.items) {
    const y = it.y + Math.sin(S.t / 12) * 4;
    ctx.fillStyle = '#ffffff33';
    ctx.beginPath(); ctx.arc(it.x, y, 22, 0, 7); ctx.fill();
    drawImgH(IMG[it.f || EPP[it.i].f], it.x, y + 17, it.bag ? 30 : 34);
  }

  for (const f of S.flames) if (!f.inner) drawFlame(f);
  drawSmoke();

  for (const b of S.bars) drawBar(b);

  if (S.victim) drawVictim(S.victim);

  drawPeople();
  drawInjured();
  drawGas();
  drawPlayer();
  drawCureBar();
  drawGasBar();
  drawJet();
  if (theme() === 'forest') drawRocks();
  if (MODS[S.mod] && MODS[S.mod].race) drawRaceFire();

  for (const q of S.parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Indicación sobre el jugador
  const nb = S.state === 'play' && nearBar();
  const hal = S.state === 'play' && toolOk('halligan');
  const ipc = hal && innerTarget(['closed']);
  const ipo = S.state === 'play' && toolOk('piton') && !ipc && innerTarget(['open']);
  const vr = hal && ventTarget();
  const swn = hal && smokeWinNear();
  const trn = hal && trappedNear();
  if (nb || ipc || ipo || vr || swn || trn) {
    // Indicación con el dibujo de la herramienta que hay que usar
    const [tool, txt] = vr ? ['halligan', 'Romper techo y ventilar'] : trn ? ['halligan', 'Romper ventana y rescatar']
      : ipc ? ['halligan', `Romper ${ipc.kind === 'door' ? 'puerta' : 'ventana'}`]
      : swn ? [null, '⚠ ¡No abrir! Ventila arriba con la halligan'] : ipo ? ['piton', 'Apagar fuego'] : ['halligan', 'Forzar puerta'];
    ctx.font = font(12); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const im = tool && IMG[`tool_${tool}`], iw = im ? 30 : 0;
    const w = ctx.measureText(txt).width + iw + 14, bx = S.p.x - w / 2, by = S.p.y - PH - 34;
    ctx.fillStyle = '#000c'; ctx.fillRect(bx, by, w, 22);
    if (im && im.complete && im.naturalWidth) ctx.drawImage(im, bx + 5, by + 11 - 15 * im.naturalHeight / im.naturalWidth, 30, 30 * im.naturalHeight / im.naturalWidth);
    ctx.fillStyle = tool ? '#ffd166' : '#ff8a6b'; ctx.fillText(txt, bx + 7 + iw, by + 12);
  }
}

// Rectángulo con contorno negro (estilo caricatura)
function box(x, y, w, h, fill, line = '#111') {
  ctx.fillStyle = line; ctx.fillRect(x - 1.5, y - 1.5, w + 3, h + 3);
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
}

function drawSill(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x + 4, y + 12, w - 8, 7);   // sombra
  box(x, y, w, 8, '#c9c9c9');
  ctx.fillStyle = '#e2e2e2'; ctx.fillRect(x, y, w, 2);
  box(x + 4, y + 9, w - 8, 3, '#8d8d8d');
  ctx.fillStyle = '#a9a9a9';
  ctx.fillRect(x + w * 0.3, y + 3, 6, 1); ctx.fillRect(x + w * 0.7, y + 5, 8, 1);
}

function glass(x, y, w, h, fire, seed) {
  let g;
  if (fire) {
    g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#2a120c'); g.addColorStop(1, `rgb(255,${110 + Math.sin(S.t / 5 + seed) * 40},20)`);
  } else {
    g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, '#3a4560'); g.addColorStop(1, '#262d3d');
  }
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath();
  ctx.moveTo(x + 3, y + h - 3); ctx.lineTo(x + Math.min(14, w - 4), y + 3); ctx.lineTo(x + Math.min(22, w - 2), y + 3); ctx.lineTo(x + 11, y + h - 3);
  ctx.fill();
}

function drawRoof(pl) {
  const { x, y, w } = pl;
  const fire = pl.inner === 'closed';
  const broken = pl.inner === 'open' || pl.inner === 'out' || pl.glassBroken;
  if (pl.kind === 'door') {
    // Balcón con puerta, baranda y maceta
    const dw = 34, dh = 56, dx = pl.side > 0 ? x + 12 : x + w - 12 - dw;
    box(dx - 4, y - dh - 4, dw + 8, dh + 4, '#a3a3a8');
    if (broken) {
      // Puerta forzada: vano oscuro con el fuego (o restos) adentro y astillas
      box(dx, y - dh, dw, dh, pl.inner === 'open' ? '#1a0d08' : '#151517');
      drawInnerFlame(pl);
      ctx.fillStyle = '#2a2d33'; ctx.fillRect(dx, y - dh, 5, dh); ctx.fillRect(dx + dw - 4, y - dh + 10, 4, 16);
    } else {
      box(dx, y - dh, dw, dh, '#1f2228');
      box(dx + 6, y - dh + 7, dw - 12, 10, fire ? `rgb(255,${120 + Math.sin(S.t / 5 + x) * 40},30)` : '#4a5368');
      ctx.fillStyle = '#9aa0aa'; ctx.beginPath(); ctx.arc(dx + dw - 6, y - dh / 2, 2, 0, 7); ctx.fill();
      if (fire) {   // resplandor por la rendija de abajo
        ctx.fillStyle = `rgba(255,${110 + Math.sin(S.t / 4 + x) * 40},20,0.8)`; ctx.fillRect(dx + 2, y - 3, dw - 4, 3);
      }
    }
    if (pl.plant) {
      const px = pl.side > 0 ? x + w - 18 : x + 18;
      box(px - 6, y - 13, 12, 13, '#7a3e2a');
      ctx.fillStyle = '#2f4a2a';
      for (const [ax, ay] of [[-6, -18], [0, -24], [6, -18], [-3, -20], [3, -20]]) {
        ctx.beginPath(); ctx.ellipse(px + ax, y - 13 + ay / 2, 3, 6, ax / 10, 0, 7); ctx.fill();
      }
    }
    // Baranda
    ctx.fillStyle = '#0d0d0f';
    ctx.fillRect(x + 2, y - 20, w - 4, 3);
    for (let i = 4; i < w - 2; i += 8) ctx.fillRect(x + i, y - 20, 2, 20);
    drawSill(x, y, w);
  } else if (pl.kind === 'ac') {
    // Repisa con equipo de aire acondicionado
    const aw = 42, ah = 30, ax = pl.side > 0 ? x + 8 : x + w - 8 - aw;
    box(ax, y - ah, aw, ah, '#b4b6ba');
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ax + 15, y - ah / 2, 11, 0, 7); ctx.fill();
    ctx.strokeStyle = '#6a6d73'; ctx.lineWidth = 1.5;
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2 + S.t / 8;
      ctx.beginPath(); ctx.moveTo(ax + 15, y - ah / 2); ctx.lineTo(ax + 15 + Math.cos(a) * 9, y - ah / 2 + Math.sin(a) * 9); ctx.stroke();
    }
    ctx.fillStyle = '#4b4e55';
    for (let k = 0; k < 3; k++) ctx.fillRect(ax + 30, y - ah + 7 + k * 5, 8, 2);
    // Tubería del equipo
    ctx.fillStyle = '#111'; ctx.fillRect(pl.side > 0 ? ax + aw : x + 2, y - 10, pl.side > 0 ? x + w - 2 - ax - aw : ax - x - 2, 5);
    drawSill(x, y, w);
  } else {
    // Ventana: marco gris, vidrio oscuro y alféizar de concreto
    const ww = w - 14, wx = x + 7, wh = 44, wy = y - wh;
    box(wx - 4, wy - 4, ww + 8, wh + 4, '#a3a3a8');
    if (broken) {
      // Ventana rota: interior oscuro con el fuego (o restos) y trozos de vidrio en las esquinas
      ctx.fillStyle = pl.inner === 'open' ? '#1a0d08' : pl.glassBroken && !pl.inner ? '#2a221d' : '#151517'; ctx.fillRect(wx, wy, ww, wh);
      drawInnerFlame(pl);
      ctx.fillStyle = 'rgba(190,215,240,0.7)';
      for (const [cx, cy, sx, sy] of [[wx, wy, 1, 1], [wx + ww, wy, -1, 1], [wx, wy + wh, 1, -1], [wx + ww, wy + wh, -1, -1]]) {
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + sx * 12, cy); ctx.lineTo(cx, cy + sy * 9); ctx.fill();
      }
    } else {
      if (pl.smokeWin === 'sealed' || pl.smokeWin === 'venting') drawSmokyGlass(pl, wx, wy, ww, wh);
      else if (pl.trapped === 'inside') drawTrappedGlass(pl, wx, wy, ww, wh);
      else glass(wx, wy, ww, wh, fire, x);
      ctx.fillStyle = '#a3a3a8';
      ctx.fillRect(wx + ww / 2 - 2, wy, 4, wh); ctx.fillRect(wx, wy + wh / 2 - 2, ww, 4);
    }
    if (!pl.fragile) drawSill(x - 3, y, w + 6);
    else if (!pl.broken) {
      // Agrietado (y temblando si ya lo pisaron)
      const j = pl.crackT ? rand(-1, 1) * Math.min(2, pl.crackT / 8) : 0;
      ctx.save(); ctx.translate(j, pl.crackT ? Math.min(3, pl.crackT / 8) : 0);
      drawSill(x - 3, y, w + 6);
      ctx.fillStyle = 'rgba(70,60,50,0.18)'; ctx.fillRect(x - 3, y, w + 6, 12);   // concreto gastado
      ctx.strokeStyle = '#1e1e22'; ctx.lineWidth = 1.7;
      ctx.beginPath();
      for (const cx of [x + w * 0.28, x + w * 0.66]) {
        ctx.moveTo(cx, y); ctx.lineTo(cx + 3, y + 3); ctx.lineTo(cx - 2, y + 6); ctx.lineTo(cx + 2, y + 11);
      }
      ctx.moveTo(x + w * 0.45, y + 2); ctx.lineTo(x + w * 0.52, y + 5); ctx.lineTo(x + w * 0.6, y + 4);
      ctx.stroke();
      ctx.restore();
    } else {
      // Roto: solo quedan dos muñones en los extremos
      box(x - 3, y, 10, 6, '#a9a9a9'); box(x + w - 7, y, 10, 6, '#a9a9a9');
      ctx.fillStyle = '#a9a9a9';
      ctx.beginPath(); ctx.moveTo(x + 7, y); ctx.lineTo(x + 13, y + 3); ctx.lineTo(x + 7, y + 6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + w - 7, y); ctx.lineTo(x + w - 12, y + 2); ctx.lineTo(x + w - 7, y + 6); ctx.fill();
    }
  }
}

// Punto del chorro (curva con un leve arco hacia arriba, como el agua a presión)
function jetPoint(j, t) {
  const d = Math.hypot(j.tx - j.sx, j.ty - j.sy);
  const cx = (j.sx + j.tx) / 2, cy = (j.sy + j.ty) / 2 - Math.min(55, d * 0.22);
  const u = 1 - t;
  return { x: u * u * j.sx + 2 * u * t * cx + t * t * j.tx, y: u * u * j.sy + 2 * u * t * cy + t * t * j.ty };
}

// Chorro de agua: halo, cuerpo, núcleo brillante y destellos que corren por el chorro
function drawJet() {
  const j = S.jet;
  if (!j) return;
  const L = S.jetLen, N = 26, pts = [];
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * L, q = jetPoint(j, t);
    const q2 = jetPoint(j, Math.min(1, t + 0.01));
    const nx = -(q2.y - q.y), ny = q2.x - q.x, nl = Math.hypot(nx, ny) || 1;
    const wob = Math.sin(t * 16 - S.t * 0.9) * 1.6 * t;   // leve temblor del chorro
    pts.push({ x: q.x + nx / nl * wob, y: q.y + ny / nl * wob, t });
  }
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const layer = (color, w0, w1, upTo = 1) => {
    ctx.strokeStyle = color;
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].t > upTo) break;
      ctx.lineWidth = w0 + (w1 - w0) * pts[i].t;   // se abre a medida que se aleja
      ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    }
  };
  layer('rgba(80,160,255,0.16)', 6, 18);
  layer('rgba(120,195,255,0.5)', 3.5, 9);
  layer('rgba(190,230,255,0.75)', 2.2, 4.5);
  layer('rgba(255,255,255,0.95)', 1.2, 1.6, 0.8);
  // Destellos que avanzan a lo largo del chorro
  ctx.setLineDash([5, 11]); ctx.lineDashOffset = -S.t * 7;
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.stroke();
  ctx.setLineDash([]);
  // Neblina en la punta del pitón y en el punto de impacto
  const mist = (x, y, r, a) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(235,248,255,${a})`); g.addColorStop(1, 'rgba(235,248,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  };
  mist(j.sx, j.sy, 7, 0.6);
  if (L >= 1) mist(j.tx, j.ty, 16 + Math.sin(S.t / 2) * 3, j.hit ? 0.55 : 0.35);
  ctx.restore();
}

// Persona atrapada detrás del vidrio, moviendo el brazo, con globo de "¡AYUDA!"
function drawTrappedGlass(pl, wx, wy, ww, wh) {
  const room = ctx.createLinearGradient(0, wy, 0, wy + wh);
  room.addColorStop(0, '#8a6a44'); room.addColorStop(1, '#5a4430');   // habitación con luz cálida
  ctx.fillStyle = room; ctx.fillRect(wx, wy, ww, wh);
  ctx.save();
  ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
  // Asomada al vidrio con las manos en alto (se ve de la cintura para arriba)
  drawWho(`${pl.who}_atrapado`, wx + ww / 2 + Math.sin(S.t / 9 + pl.ph) * 2, wy + wh + 30, 70, pl.ph > 3 ? -1 : 1);
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
  ctx.fillStyle = 'rgba(160,200,235,0.18)'; ctx.fillRect(wx, wy, ww, wh);   // reflejo del vidrio
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.moveTo(wx + 3, wy + wh - 3); ctx.lineTo(wx + 14, wy + 3); ctx.lineTo(wx + 20, wy + 3); ctx.lineTo(wx + 9, wy + wh - 3); ctx.fill();
  ctx.restore();
  // Globo de ayuda que parpadea
  if (Math.floor(S.t / 30 + pl.ph) % 3 !== 2) {
    const bx = wx + ww / 2, by = wy - 16;
    ctx.font = font(10); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText('¡AYUDA!').width + 10;
    box(bx - tw / 2, by - 7, tw, 14, '#ffffff');
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.moveTo(bx - 4, by + 8.5); ctx.lineTo(bx + 4, by + 8.5); ctx.lineTo(bx, by + 13); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(bx - 3, by + 7); ctx.lineTo(bx + 3, by + 7); ctx.lineTo(bx, by + 11); ctx.fill();
    ctx.fillStyle = '#c1121f'; ctx.fillText('¡AYUDA!', bx, by + 0.5);
  }
}

// Vidrio de una ventana llena de humo denso: humo negro arremolinándose y un brillo de brasas que late
function drawSmokyGlass(pl, wx, wy, ww, wh) {
  const clear = pl.smokeWin === 'venting' ? Math.min(1, pl.ventT / 240) : 0;
  glass(wx, wy, ww, wh, false, wx);
  ctx.save();
  ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
  ctx.globalAlpha = 1 - clear;
  ctx.fillStyle = '#0f0d0c'; ctx.fillRect(wx, wy, ww, wh);
  const pulse = 0.5 + Math.sin(S.t / 18 + pl.x) * 0.5;
  const g = ctx.createLinearGradient(0, wy + wh, 0, wy);
  g.addColorStop(0, `rgba(110,30,10,${0.08 + pulse * 0.14})`); g.addColorStop(1, 'rgba(110,30,10,0)');
  ctx.fillStyle = g; ctx.fillRect(wx, wy, ww, wh);
  for (let i = 0; i < 5; i++) {
    const t = S.t / 40 + i * 1.7 + pl.x;
    const px = wx + ww / 2 + Math.sin(t) * ww * 0.35, py = wy + wh / 2 + Math.cos(t * 0.8) * wh * 0.3, d = 34 + i * 4;
    ctx.globalAlpha = (1 - clear) * 0.8;
    ctx.drawImage(PUFF.dark[i % 3], px - d / 2, py - d / 2, d, d);
  }
  ctx.restore();
  // Hollín sobre el marco
  ctx.fillStyle = `rgba(20,16,14,${0.5 * (1 - clear)})`; ctx.fillRect(wx - 4, wy - 4, ww + 8, 6);
}

// Techo sobre la ventana con humo: losa con trampilla que se rompe con la halligan
function drawVentRoof(pl) {
  const { x, y, w } = pl, hx = x + w / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x + 4, y + 11, w - 8, 6);
  box(x, y, w, 10, '#7c7c82');
  ctx.fillStyle = '#9a9aa0'; ctx.fillRect(x, y, w, 2);
  if (!pl.opened) {
    box(hx - 14, y + 1, 28, 6, '#5d636e');
    ctx.fillStyle = '#c9ccd2';
    for (const k of [-11, -4, 4, 11]) ctx.fillRect(hx + k - 0.5, y + 3, 1.5, 1.5);
    if (pl.win.smokeWin === 'sealed') {   // humo que se cuela por la trampilla
      ctx.fillStyle = `rgba(30,26,24,${0.4 + Math.sin(S.t / 18 + x) * 0.2})`; ctx.fillRect(hx - 14, y + 7, 28, 2);
    }
  } else {
    ctx.fillStyle = '#0e0c0b'; ctx.fillRect(hx - 15, y, 30, 10);
    ctx.fillStyle = '#7c7c82';
    ctx.beginPath(); ctx.moveTo(hx - 15, y); ctx.lineTo(hx - 9, y + 4); ctx.lineTo(hx - 15, y + 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx + 15, y + 2); ctx.lineTo(hx + 8, y + 5); ctx.lineTo(hx + 15, y + 10); ctx.fill();
  }
}

// Fuego dentro de una ventana/puerta rota, recortado a la abertura
function drawInnerFlame(pl) {
  if (!pl.flame || pl.flame.dead >= 70) return;
  const r = opening(pl);
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
  drawFlame(pl.flame);
  ctx.restore();
}

// Llama con sprites: crece (llama_1→3) y al mojarla se apaga (apaga_1→3)
function drawFlame(f) {
  let key, alpha = 1, fl = 1;
  if (f.hp <= 0) { key = 'apaga_3'; alpha = 1 - f.dead / 70; }
  else if (f.hp < 40) key = `apaga_${f.hp > 26 ? 1 : f.hp > 12 ? 2 : 3}`;
  else { key = `llama_${f.age < 300 ? 1 : f.age < 600 ? 2 : 3}`; fl = 1 + Math.sin(S.t / 5 + f.ph) * 0.05; }
  const im = IMG[key];
  if (!im || !im.complete || !im.naturalWidth) return;
  const w = im.naturalWidth / 2, h = im.naturalHeight / 2 * fl;
  ctx.globalAlpha = alpha;
  ctx.drawImage(im, f.x - w / 2, f.y + 3 - h, w, h);
  ctx.globalAlpha = 1;
}

// Techo cerrado con escalera lateral: losa + caja de escalera con puerta
function drawStairCeiling(b) {
  const y = b.y, gx = stairX(b), ly = y + STAIR_DROP, my = y + STAIR_DROP / 2;
  // Caja de la escalera (entre la losa y el descanso)
  box(gx, y + 14, STAIR_GAP, ly - y - 14, '#3a3a40');
  ctx.fillStyle = '#4a4a52'; ctx.fillRect(gx, my - 2, STAIR_GAP, 3);   // línea del piso intermedio
  const dw = 40, dh = 56, dx = gx + (STAIR_GAP - dw) / 2;
  if (b.open) {
    // Vano abierto: tramos de escalera hasta el escalón intermedio y hacia el hueco de la losa
    ctx.fillStyle = '#141416'; ctx.fillRect(gx + 3, y - 2, STAIR_GAP - 6, ly - y + 2);
    ctx.fillStyle = '#4a4a52';
    for (let k = 0; k < 6; k++) {
      ctx.fillRect(gx + 6 + (b.side > 0 ? k * 8 : (5 - k) * 8), ly - 6 - k * 11, 16, 3);
      ctx.fillRect(gx + 6 + (b.side > 0 ? (5 - k) * 8 : k * 8), my - 6 - k * 10, 16, 3);
    }
    drawSill(gx + 5, my, STAIR_GAP - 10);   // escalón intermedio
    ctx.fillStyle = '#7a4a24';   // hoja de la puerta forzada, abierta contra el marco
    ctx.fillRect(b.side > 0 ? dx - 2 : dx + dw - 4, ly - dh, 6, dh);
  } else {
    box(dx, ly - dh, dw, dh, '#8a2b22');
    ctx.fillStyle = '#6e2019'; ctx.fillRect(dx + 4, ly - dh + 4, dw - 8, dh - 8);
    box(dx + 4, ly - dh + 8, dw - 8, 10, '#e8e0c8');
    ctx.fillStyle = '#2b2b2b'; ctx.font = font(7); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ESCALERA', dx + dw / 2, ly - dh + 13.5, dw - 10);
    ctx.fillStyle = '#d0d0d0'; ctx.fillRect(dx + dw - 9, ly - dh / 2, 5, 2);
  }
  // Losa del techo (con hueco sobre la escalera si ya se abrió)
  const slab = (x0, w) => {
    box(x0, y, w, 14, '#6e6e74');
    ctx.fillStyle = '#8a8a90'; ctx.fillRect(x0, y, w, 3);
    ctx.fillStyle = '#55555a';
    for (let x = x0 + 30; x < x0 + w; x += 60) ctx.fillRect(x, y + 5, 2, 9);
  };
  if (!b.open) slab(0, W);
  else if (b.side > 0) slab(0, W - STAIR_GAP);
  else slab(STAIR_GAP, W - STAIR_GAP);
  // Flecha hacia la puerta mientras siga cerrada
  if (!b.open) {
    const ax = b.side > 0 ? W - STAIR_GAP - 26 : STAIR_GAP + 26, bob = Math.sin(S.t / 8) * 3;
    const tx = ax + bob * b.side, d = b.side;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.moveTo(tx + d * 11, y + 32); ctx.lineTo(tx - d * 8, y + 22); ctx.lineTo(tx - d * 8, y + 42); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.moveTo(tx + d * 8, y + 32); ctx.lineTo(tx - d * 6, y + 25); ctx.lineTo(tx - d * 6, y + 39); ctx.fill();
  }
}

function drawBar(b) {
  if (b.t === 'smoke' && b.smoke > 0) {
    const top = b.y - 210;
    ctx.fillStyle = `rgba(40,40,45,${0.96 * b.smoke})`;
    ctx.fillRect(0, top, W, 210);
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = `rgba(95,95,100,${0.45 * b.smoke})`;
      ctx.beginPath();
      ctx.arc((i * 47 + Math.sin(S.t / 40 + i) * 12) % W, top + (i % 3) * 70 + 35, 38, 0, 7);
      ctx.fill();
    }
    if (!b.open) {
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, top - 6, W, 6);
      if (b.vented) ctx.clearRect(W / 2 - 30, top - 6, 60, 6);
      ctx.font = font(11); ctx.textAlign = 'center'; ctx.fillStyle = '#ccc';
      ctx.fillText(b.vented ? 'TECHO VENTILADO' : 'TECHO', W / 2, top + 10);
    }
  }
  if (b.t === 'door') { drawStairCeiling(b); return; }
  if (b.open) return;
  const y = b.y;
  ctx.fillStyle = b.t === 'door' ? '#6b3f1f' : '#3b3330';
  ctx.fillRect(0, y, W, 14);
  ctx.strokeStyle = '#00000055'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 20) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 14); ctx.stroke(); }
  ctx.fillStyle = '#999';
  ctx.fillRect(0, y, W, 2); ctx.fillRect(0, y + 12, W, 2);
  if (b.t === 'smoke' && !b.vented) {
    const pulse = 0.5 + Math.sin(S.t / 15) * 0.3;
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = `rgba(60,60,60,${pulse})`;
      ctx.beginPath(); ctx.arc(i * 55 + 20, y + 18 + Math.sin(S.t / 20 + i) * 3, 9, 0, 7); ctx.fill();
    }
  }
  const label = b.t === 'door' ? '🔒 PUERTA CERRADA' : b.vented ? '✔ VENTILADO — ABRIR' : '⚠ HUMO DENSO';
  ctx.font = font(11); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(label).width + 14;
  ctx.fillStyle = '#000c'; ctx.fillRect(W / 2 - w / 2, y + 16, w, 17);
  ctx.fillStyle = b.t === 'door' ? '#fff' : '#ffb347';
  ctx.fillText(label, W / 2, y + 25);
}

function drawVictim(v) {
  if (S.state === 'win') { drawCelebration(v); return; }
  drawWho(`${v.who}_atrapado`, v.x + Math.sin(S.t / 9) * 1.5, v.y, 60);
  if (Math.floor(S.t / 30) % 3 !== 2) {
    ctx.font = font(11); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText('¡AYUDA!').width + 10;
    box(v.x - tw / 2, v.y - 82, tw, 15, '#ffffff');
    ctx.fillStyle = '#c1121f'; ctx.fillText('¡AYUDA!', v.x, v.y - 74);
  }
}

// En la azotea: la víctima y todas las personas rescatadas celebran
function drawCelebration(v) {
  const crew = [v.who, ...S.saved].slice(0, 8);
  const n = crew.length, span = Math.min(W - 60, n * 46);
  crew.forEach((who, i) => {
    let x = W / 2 - span / 2 + span * (i + 0.5) / n;
    if (Math.abs(x - S.p.x) < 22) x += x < S.p.x ? -22 : 22;
    const hop = Math.abs(Math.sin(S.winT / 7 + i * 1.3)) * 9;
    drawWho(`${who}_victoria`, x, v.y - hop, 60, i % 2 ? 1 : -1);
  });
}

function drawPlayer() {
  const p = S.p, x = p.x, y = p.y, d = p.dir;
  const stage = S.medic ? 'p' : Math.min(STAGES, 1 + S.epp);
  let key = `idle_${stage}`, h = 70;
  if (S.state === 'dying' || S.state === 'over') {
    key = `derrota_${S.dieT < 25 ? 1 : S.dieT < 55 ? 2 : 3}`; h = 0;
  } else if (S.hurtT > 0) {
    key = `dano_${2 + Math.min(3, Math.floor((40 - S.hurtT) / 10))}`; h = 0;
  } else if (S.halT > 0) {
    const f = S.tool === 'palanca' ? Math.min(5, 1 + Math.floor((LEV_T - S.halT) / 12))
      : S.halT > 27 ? 1 : S.halT > HAL_HIT ? 2 : 3;
    key = `${S.tool}_${f}`; h = -1;
  } else if (S.hoseT > 0) {
    key = S.hoseT < 6 ? 'piton_1' : S.hoseT < 12 ? 'piton_2' : `apunta_${S.aim || 'frente'}`; h = -1;
  } else if (S.gasT > 0) {
    key = `gasstop_${1 + Math.min(5, Math.floor(S.gasT / (GASFIX_T / 6)))}`; h = 54;   // arrodillado: 6 cuadros en 1 s
  } else if (S.cureT > 0) {
    key = `curar_${1 + Math.min(2, Math.floor(S.cureT / (CURE_T / 3)))}`; h = 0;   // venda: 3 cuadros en 1 s
  } else if (S.inv > 0 && Math.floor(S.t / 4) % 2) return;
  else if (!p.ground) [key, h] = p.vy < -3 ? [`salto_${stage}`, 60] : [`aire_${stage}`, 58];
  else if (S.landT > 0) [key, h] = [`aterriza_${stage}`, 46];
  else if (Math.abs(p.vx) > 0.8) key = `camina_${stage}_${1 + Math.floor(S.t / 6) % 6}`;
  ctx.save();
  ctx.translate(x, y + 2);
  ctx.scale(d, 1);
  const im = IMG[key];
  if (im && im.complete && im.naturalWidth) {
    if (!h) h = im.naturalHeight / 2; // daño y derrota: misma escala que el resto (exportados al doble)
    if (h < 0) h = im.naturalHeight * 70 / 152; // halligan: misma escala que idle_7
    const w = im.naturalWidth * h / im.naturalHeight;
    const ax = POSE[key] ? POSE[key].ax * w : w / 2;   // las poses con manguera se apoyan en las botas
    ctx.drawImage(im, -ax, -h, w, h);
  }
  // Pitón de la manguera
  ctx.restore();
}

function drawDarkness() {
  const p = S.p, d = darkLevel();
  if (d <= 0) return;
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = `rgba(6,6,8,${0.86 * d})`;   // sin linterna: muy oscuro, pero se alcanza a ver algo
  dctx.fillRect(0, 0, W, H);
  dctx.globalCompositeOperation = 'destination-out';
  // Luz que atraviesa el humo; k = cuánto aclara (1 = totalmente)
  const hole = (x, y, r, k = 1) => {
    const g = dctx.createRadialGradient(x, y, r * 0.3, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${k})`); g.addColorStop(1, '#0000');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, 7); dctx.fill();
  };
  const hx = p.x, hy = p.y - 32 - S.camY;
  if (S.lamp) {
    // Haz de la linterna: hacia arriba y adelante, según hacia dónde mira el bombero
    // Haz tenue: aclara solo en parte, así el humo sigue viéndose oscuro
    const a = p.dir > 0 ? -Math.PI * 0.36 : -Math.PI * 0.64, half = 0.38, len = 250;
    const fl = 0.95 + Math.sin(S.t / 7) * 0.03;
    const g = dctx.createRadialGradient(hx, hy, 15, hx, hy, len);
    g.addColorStop(0, `rgba(0,0,0,${0.62 * fl})`); g.addColorStop(0.6, `rgba(0,0,0,${0.42 * fl})`); g.addColorStop(1, '#0000');
    dctx.fillStyle = g;
    dctx.beginPath(); dctx.moveTo(hx, hy); dctx.arc(hx, hy, len, a - half, a + half); dctx.closePath(); dctx.fill();
    hole(hx, hy, 55, 0.5);
  }
  for (const f of S.flames) if (f.hp > 0) hole(f.x, f.y - 12 - S.camY, 45, 0.7);   // el fuego da algo de luz
  for (const pl of S.plats) if (pl.inner === 'closed') { const r = opening(pl); hole(r.x + r.w / 2, r.y + r.h / 2 - S.camY, 35, 0.6); }
  ctx.drawImage(dark, 0, 0, W, H);
  ctx.fillStyle = `rgba(90,90,90,${0.15 * d})`;
  ctx.fillRect(0, 0, W, H);
  if (S.lamp) {
    // Brillo cálido del haz sobre el humo
    const a = p.dir > 0 ? -Math.PI * 0.36 : -Math.PI * 0.64;
    const g = ctx.createRadialGradient(hx, hy, 10, hx, hy, 240);
    g.addColorStop(0, 'rgba(255,235,180,0.12)'); g.addColorStop(1, 'rgba(255,235,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.arc(hx, hy, 240, a - 0.38, a + 0.38); ctx.closePath(); ctx.fill();
  }
}

function drawHUD() {
  ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, 34);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = font(16);
  ctx.fillText('❤️'.repeat(Math.max(0, S.lives)), 8, 17);
  ctx.textAlign = 'center';
  if (MODS[S.mod] && !(MODS[S.mod].epp && S.phase === 1)) {
    ctx.font = font(13); ctx.fillStyle = '#ffd166'; ctx.fillText(MODS[S.mod].title, 190, 17);
    if (S.mod === 'medico') {
      ctx.textAlign = 'left'; ctx.font = font(13); ctx.fillStyle = '#7f7';
      ctx.fillText(`✚${S.cured}`, 86, 17);
      ctx.textAlign = 'center';
    }
    if (MODS[S.mod].race) {   // distancia al fuego
      ctx.font = font(13); ctx.fillStyle = '#ff8a4d';
      ctx.fillText(`🔥 ${Math.max(0, Math.round((S.fireY - S.p.y) / 30))} m`, 190, 46);
    }
  } else for (let i = 0; i < EPP.length; i++) {
    ctx.globalAlpha = i < S.epp ? 1 : 0.25;
    drawImgH(IMG[EPP[i].f], 120 + i * 28, 30, 26);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'right'; ctx.font = font(14); ctx.fillStyle = '#fff';
  ctx.fillText(Math.max(0, Math.round((H - 20 - S.p.y) / 30)) + ' m', W - 8, 17);
  if (S.levelIdx >= 0) {
    ctx.font = font(11); ctx.textAlign = 'center'; ctx.fillStyle = '#ffd166';
    ctx.fillText(`NV ${S.levelIdx + 1}`, 332, 17);
  }
  if (S.banner) {
    const b = S.banner, a = clamp(Math.min(b.t, 200 - b.t) / 25, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#000c'; ctx.fillRect(20, 120, W - 40, 86);
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.strokeRect(20, 120, W - 40, 86);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = font(13); ctx.fillStyle = '#ffd166';
    ctx.fillText(`NIVEL ${b.lv.i + 1} DE ${S.levels.length}`, W / 2, 138);
    ctx.font = font(22); ctx.fillStyle = '#fff';
    ctx.fillText(b.lv.name.toUpperCase(), W / 2, 163);
    ctx.font = font(12); ctx.fillStyle = '#ddd';
    ctx.fillText(b.lv.hint, W / 2, 189, W - 56);
    ctx.globalAlpha = 1;
  }

  if (S.msg && S.msg.text) {
    ctx.font = font(13); ctx.textAlign = 'center';
    const lines = wrap(S.msg.text, W - 40);
    ctx.globalAlpha = clamp(S.msg.t / 30, 0, 1);
    ctx.fillStyle = '#000c';
    ctx.fillRect(14, 42, W - 28, lines.length * 18 + 10);
    ctx.fillStyle = S.msg.color;
    lines.forEach((l, i) => ctx.fillText(l, W / 2, 56 + i * 18));
    ctx.globalAlpha = 1;
  }

}

function wrap(text, maxW) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

// Botón "toca para jugar" que late
function tapButton(label, y) {
  const k = 1 + Math.sin(performance.now() / 260) * 0.05;
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, k);
  ctx.fillStyle = '#111'; ctx.fillRect(-122, -24, 244, 48);
  const g = ctx.createLinearGradient(0, -22, 0, 22);
  g.addColorStop(0, '#ffb000'); g.addColorStop(1, '#e8430c');
  ctx.fillStyle = g; ctx.fillRect(-119, -21, 238, 42);
  ctx.font = font(24); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#3a0d00'; ctx.fillText(label, 2, 3);
  ctx.fillStyle = '#fff'; ctx.fillText(label, 0, 1);
  ctx.restore();
}

// Botones de los módulos en el menú (el primero late)
const MENU_Y = { modulos: 450, emergencia: 520 };
function moduleButton(label, sub, y, pulse) {
  const k = pulse ? 1 + Math.sin(performance.now() / 260) * 0.04 : 1;
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, k);
  ctx.fillStyle = '#111'; ctx.fillRect(-132, -27, 264, 54);
  const g = ctx.createLinearGradient(0, -25, 0, 25);
  g.addColorStop(0, pulse ? '#ffb000' : '#c0392b'); g.addColorStop(1, pulse ? '#e8430c' : '#7a1d12');
  ctx.fillStyle = g; ctx.fillRect(-129, -24, 258, 48);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(21); ctx.fillStyle = '#3a0d00'; ctx.fillText(label, 2, -6);
  ctx.fillStyle = '#fff'; ctx.fillText(label, 0, -8);
  ctx.font = font(12); ctx.fillStyle = '#ffe9a8'; ctx.fillText(sub, 0, 13);
  ctx.restore();
}

// Pantalla con los 14 módulos en dos columnas
const TILE = { x: [12, 206], y0: 66, dy: 74, w: 182, h: 66 };
function drawModsScreen() {
  ctx.fillStyle = '#0b0f18'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(24); ctx.fillStyle = '#ffd166'; ctx.fillText('MÓDULOS DE ENTRENAMIENTO', W / 2, 32);
  const pr = Progress.get();
  MOD_LIST.forEach(([id, name], i) => {
    const x = TILE.x[i % 2], y = TILE.y0 + Math.floor(i / 2) * TILE.dy, soon = !MODS[id];
    ctx.fillStyle = '#111'; ctx.fillRect(x - 2, y - 2, TILE.w + 4, TILE.h + 4);
    const g = ctx.createLinearGradient(0, y, 0, y + TILE.h);
    g.addColorStop(0, soon ? '#2a2d36' : '#d9481c'); g.addColorStop(1, soon ? '#1b1d24' : '#7a1d12');
    ctx.fillStyle = g; ctx.fillRect(x, y, TILE.w, TILE.h);
    ctx.font = font(34); ctx.textAlign = 'center'; ctx.fillStyle = soon ? '#555' : '#ffd166';
    ctx.fillText(i + 1, x + 24, y + TILE.h / 2 + 2);
    ctx.textAlign = 'left'; ctx.font = font(15); ctx.fillStyle = soon ? '#888' : '#fff';
    ctx.fillText(name, x + 46, y + 23, TILE.w - 52);
    ctx.font = font(soon ? 11 : 15);
    ctx.fillStyle = soon ? '#777' : '#ffe9a8';
    ctx.fillText(soon ? '🔒 PRÓXIMAMENTE' : '★'.repeat(pr[id] || 0) + '☆'.repeat(3 - (pr[id] || 0)), x + 46, y + 46);
  });
  ctx.textAlign = 'center'; ctx.font = font(18); ctx.fillStyle = '#ffd166'; ctx.fillText('‹ MENÚ', W / 2, 612);
}

// Pantalla de inicio: logo, chispas y botones de los módulos
function drawMenu() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#091220'); g.addColorStop(0.6, '#0e121c'); g.addColorStop(1, '#3a1206');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;
  for (let i = 0; i < 40; i++) {   // chispas que suben
    const x = (i * 97 + Math.sin(t + i) * 20) % W, y = H - ((t * (30 + (i % 7) * 12) + i * 53) % (H + 40));
    ctx.globalAlpha = 0.4 + (i % 5) * 0.12;
    ctx.fillStyle = i % 3 ? '#ff8c1a' : '#ffd23f';
    ctx.fillRect(x, y, 2 + (i % 3), 2 + (i % 3));
  }
  ctx.globalAlpha = 1;
  const lg = IMG.logo;
  if (lg && lg.complete && lg.naturalWidth) {
    const lw = W - 16, lh = lw * lg.naturalHeight / lg.naturalWidth, bob = Math.sin(t * 2) * 4;
    ctx.drawImage(lg, 8, 70 + bob, lw, lh);
  }
  ctx.font = font(17); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd166'; ctx.fillText('EQUÍPATE · APAGA · RESCATA', W / 2, 388);
  const pr = Progress.get(), st = n => '★'.repeat(n || 0) + '☆'.repeat(3 - (n || 0));
  const got = MOD_LIST.reduce((a, [id]) => a + (pr[id] || 0), 0), playable = MOD_LIST.filter(([id]) => MODS[id]).length;
  moduleButton('MÓDULOS', `${MOD_LIST.length} entrenamientos · ★ ${got}/${playable * 3}`, MENU_Y.modulos, true);
  moduleButton('EMERGENCIA', 'Todo junto · ranking mundial', MENU_Y.emergencia, false);
  ctx.font = font(18); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000a'; ctx.fillRect(W / 2 - 80, 598, 160, 30);
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - 80, 598, 160, 30);
  ctx.fillStyle = '#ffd166'; ctx.fillText('🏆 RANKING', W / 2, 614);
  if (Tilt.btn.style.display !== 'none') {
    ctx.font = font(12); ctx.textAlign = 'left'; ctx.fillStyle = '#aaa';
    ctx.fillText(Tilt.on ? 'Control: inclinación 📱' : 'Control: flechas ⬅➡', 10, 18);
  }
}

// Pantalla final: desglose del puntaje, total sobre 1000 y récord
function drawScoreScreen(title, color) {
  const F = S.final || computeScore(false);
  ctx.fillStyle = '#000d'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(32); ctx.fillStyle = color; ctx.fillText(title, W / 2, 90);
  const m = Math.floor(F.secs / 60), sec = String(Math.floor(F.secs % 60)).padStart(2, '0');
  ctx.font = font(14); ctx.fillStyle = '#bbb';
  ctx.fillText(`Tiempo ${m}:${sec} · Altura ${Math.max(0, Math.round((H - 20 - S.p.y) / 30))} m`, W / 2, 125);
  F.rows.forEach(([label, pts, max], i) => {
    const y = 165 + i * 34;
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(30, y - 14, W - 60, 28);
    ctx.fillStyle = '#ffb347'; ctx.fillRect(30, y + 10, (W - 60) * (pts / max), 4);   // barra de avance
    ctx.font = font(15); ctx.textAlign = 'left'; ctx.fillStyle = '#eee'; ctx.fillText(label, 40, y);
    ctx.textAlign = 'right'; ctx.fillStyle = pts ? '#ffd166' : '#777'; ctx.fillText(`${pts} / ${max}`, W - 40, y);
  });
  ctx.textAlign = 'center';
  ctx.font = font(18); ctx.fillStyle = '#ddd'; ctx.fillText('PUNTAJE', W / 2, 382);
  ctx.font = font(52); ctx.fillStyle = '#3a0d00'; ctx.fillText(`${F.total}`, W / 2 + 3, 425);
  ctx.fillStyle = '#ffd166'; ctx.fillText(`${F.total}`, W / 2, 422);
  ctx.font = font(14); ctx.fillStyle = '#aaa'; ctx.fillText('de 1000', W / 2, 455);
  ctx.font = font(15);
  ctx.fillStyle = F.record ? '#7f7' : '#bbb';
  ctx.fillText(F.record ? '¡NUEVO RÉCORD!' : `Récord: ${F.best}`, W / 2, 488);
  tapButton(qualifies(F.total) && !S.savedEntry ? '¡TOP 10! ANOTA TU NOMBRE' : 'VER RANKING', 560);
}

// Pantalla final del entrenamiento: estrellas, tiempo y caídas
function drawTrainScreen(title, color) {
  const F = S.final;
  ctx.fillStyle = '#000d'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(30); ctx.fillStyle = color; ctx.fillText(title, W / 2, 110);
  ctx.font = font(15); ctx.fillStyle = '#ffd166'; ctx.fillText(MODS[S.mod].title, W / 2, 150);
  for (let i = 0; i < 3; i++) {
    const on = i < F.stars, pop = on ? 1 + Math.max(0, 1 - (S.winT - 170 - i * 15) / 12) * 0.4 : 1;
    ctx.save(); ctx.translate(W / 2 + (i - 1) * 78, 235); ctx.scale(Math.min(pop, 1.4), Math.min(pop, 1.4));
    ctx.font = font(64); ctx.fillStyle = on ? '#ffd166' : '#444'; ctx.fillText('★', 0, 0);
    ctx.restore();
  }
  const m = Math.floor(F.secs / 60), sec = String(Math.floor(F.secs % 60)).padStart(2, '0');
  ctx.font = font(16); ctx.fillStyle = '#ddd';
  ctx.fillText(`Tiempo ${m}:${sec}  ·  Caídas ${F.falls}  ·  Altura ${Math.max(0, Math.round((H - 20 - S.p.y) / 30))} m`, W / 2, 315);
  if (S.mod === 'medico') { ctx.fillStyle = '#7f7'; ctx.fillText(`Heridos curados: ${F.cured} de ${F.injTotal}`, W / 2, 340); }
  if (MODS[S.mod].tasks) { ctx.fillStyle = '#7f7'; ctx.fillText(`Tareas resueltas: ${F.done} de ${F.taskTotal}`, W / 2, 340); }
  ctx.font = font(14); ctx.fillStyle = '#aaa';
  ctx.fillText(MODS[S.mod].rule, W / 2, 368);
  ctx.font = font(16); ctx.fillStyle = F.record ? '#7f7' : '#bbb';
  ctx.fillText(F.record ? '¡NUEVO RÉCORD!' : `Tu mejor resultado: ${'★'.repeat(F.best) || 'sin estrellas'}`, W / 2, 400);
  tapButton('REINTENTAR', 500);
  ctx.font = font(18); ctx.fillStyle = '#ffd166'; ctx.fillText('‹ MENÚ', W / 2, 570);
}

// Pantalla del ranking: los 10 mejores; si el puntaje entra, pide el nombre
function drawRankScreen(fromMenu) {
  ctx.fillStyle = '#000e'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(36); ctx.fillStyle = '#3a0d00'; ctx.fillText('🏆 TOP 10', W / 2 + 2, 72);
  ctx.fillStyle = '#ffd166'; ctx.fillText('🏆 TOP 10', W / 2, 70);
  for (let i = 0; i < 10; i++) {
    const e = rankList[i], y = 125 + i * 33, mine = e && S.myEntry && e.d === S.myEntry.d;
    ctx.fillStyle = mine ? 'rgba(255,176,0,0.35)' : i % 2 ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.08)';
    ctx.fillRect(30, y - 14, W - 60, 28);
    ctx.font = font(17);
    ctx.textAlign = 'left'; ctx.fillStyle = i < 3 ? ['#ffd166', '#d9d9e0', '#e0a070'][i] : '#aaa';
    ctx.fillText(`${i + 1}.`, 42, y);
    ctx.fillStyle = e ? '#fff' : '#555'; ctx.fillText(e ? e.n : '— — —', 80, y);
    ctx.textAlign = 'right'; ctx.fillStyle = e ? '#ffd166' : '#555'; ctx.fillText(e ? e.s : '', W - 42, y);
  }
  ctx.textAlign = 'center';
  ctx.font = font(12); ctx.fillStyle = Ranking.online ? '#7f7' : '#aaa';
  ctx.fillText(Ranking.online ? '● RANKING MUNDIAL' : '○ SIN CONEXIÓN · ranking guardado en este celular', W / 2, 455);
  if (fromMenu) {
    ctx.font = font(15); ctx.fillStyle = '#aaa'; ctx.fillText('Toca para volver', W / 2, 560);
    return;
  }
  const pending = nameBox.classList.contains('on');
  if (pending) {
    ctx.font = font(18); ctx.fillStyle = '#7f7';
    ctx.fillText(`¡Entraste al TOP 10 con ${S.final.total} puntos!`, W / 2, 470);
    ctx.font = font(14); ctx.fillStyle = '#ccc'; ctx.fillText('Escribe tu nombre (máx. 8 letras)', W / 2, 494);
    placeNameBox(535);
  } else {
    ctx.font = font(16); ctx.fillStyle = '#ccc';
    ctx.fillText(S.myEntry ? '¡Quedaste en el ranking!' : `Tu puntaje: ${S.final.total}`, W / 2, 490);
    tapButton('JUGAR DE NUEVO', 590);
    ctx.font = font(14); ctx.fillStyle = '#ffd166'; ctx.fillText('‹ MENÚ', W / 2, 628);
  }
}

function drawScreen(title, lines, color) {
  ctx.fillStyle = '#000c'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font(34); ctx.fillStyle = color;
  ctx.fillText(title, W / 2, 150);
  ctx.font = font(15); ctx.fillStyle = '#eee';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 215 + i * 26));
  tapButton('JUGAR DE NUEVO', 560);
}

function draw() {
  ctx.save();
  if (S.shake) ctx.translate(rand(-S.shake, S.shake) / 2, rand(-S.shake, S.shake) / 2);
  drawBg();
  ctx.save(); ctx.translate(0, -S.camY); drawWorld(); ctx.restore();
  drawDarkness();
  ctx.restore();
  if (S.state === 'menu') {
    if (S.view === 'rank') drawRankScreen(true); else if (S.view === 'mods') drawModsScreen(); else drawMenu();
  } else {
    drawHUD();
    if (MODS[S.mod] && S.state === 'win' && S.winT < 170) {
      ctx.font = font(22); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000a'; ctx.fillRect(0, 70, W, 40);
      ctx.fillStyle = '#7f7'; ctx.fillText('¡LLEGASTE A LA AZOTEA!', W / 2, 90);
    } else if (MODS[S.mod] && (S.state === 'over' || S.state === 'win')) {
      drawTrainScreen(S.state === 'win' ? '¡ENTRENAMIENTO SUPERADO!' : 'FIN DEL ENTRENAMIENTO', S.state === 'win' ? '#7f7' : '#ff6b6b');
    } else if (S.state === 'over') {
      if (S.view === 'rank') drawRankScreen(false); else drawScoreScreen('FIN DEL TURNO', '#ff6b6b');
    } else if (S.state === 'win' && S.winT < 170) {
      ctx.font = font(22); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#000a'; ctx.fillRect(0, 70, W, 40);
      ctx.fillStyle = '#7f7'; ctx.fillText('¡RESCATE COMPLETO!', W / 2, 90);
    } else if (S.state === 'win') {
      if (S.view === 'rank') drawRankScreen(false); else drawScoreScreen('¡VÍCTIMA RESCATADA!', '#7f7');
    }
  }
}

// Bucle a 60 pasos/seg fijos
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (S.state === 'play') update();
    else {
      if (S.state === 'win') S.winT++;
      if (S.state === 'dying') {
        S.t++;
        dyingFall();
        if (++S.dieT > 150) S.state = 'over';
        if (S.msg && --S.msg.t <= 0) S.msg = null;
      }
      updateParts();
    }
    acc -= 1000 / 60;
  }
  draw();
  document.getElementById('controls').classList.toggle('on', S.state === 'play');
  requestAnimationFrame(loop);
}
newGame('menu');
requestAnimationFrame(loop);
</script>
