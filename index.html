// x del balón sobre su alféizar
const gasX = pl => pl.gas.side > 0 ? pl.x + pl.w - 20 : pl.x + 20;

// Balón con fuga al alcance del bombero (parado en el mismo alféizar)
function gasNear() {
  const p = S.p;
  return S.plats.find(pl => pl.gas && pl.gas.state === 'leak' && p.ground === pl && Math.abs(gasX(pl) - p.x) < 60);
}

// Balones: se activan al acercarse, cuentan 4 s y explotan; el Gas Stop sostenido 1 s los asegura
function updateGas() {
  const p = S.p;
  for (const pl of S.plats) {
    const g = pl.gas;
    if (!g) continue;
    if (g.state === 'ok' && pl.y > S.camY + 40 && pl.y < S.camY + H - 40 && Math.abs(pl.y - p.y) < 170) {
      g.state = 'leak'; g.t = GAS_T; SFX.play('click');
      if (!S.gasWarned) { S.gasWarned = true; toast('¡Fuga de gas! Ve al balón y mantén el Gas Stop 1 segundo', '#ffb347'); }
    }
    if (g.state === 'leak') {
      g.t--;
      if (S.t % 5 === 0) addSmoke(gasX(pl) + rand(-14, 14), pl.y - rand(22, 40), 'light', 0.55);
      if (g.t <= 0) explodeGas(pl);
    }
  }
  const hp = keys.gas && toolOk('gasstop') && p.ground ? gasNear() : null;
  if (hp) {
    S.gasT++;
    p.dir = gasX(hp) >= p.x ? 1 : -1;
    if (S.gasT % 15 === 1) SFX.play('click');
    if (S.gasT >= GASFIX_T) {
      hp.gas.state = 'fixed'; S.gasFixed++; S.gasT = 0;
      SFX.play('tools');
      burst(gasX(hp), hp.y - 30, 22, ['#ffd23f', '#fff', '#9b59ff'], 3, 0.05, 36, 3);
      toast(`¡Balón asegurado! (${S.gasFixed})`, '#7f7');
    }
    return;
  }
  if (keys.gas && !S.gasT && (!S.msg || S.msg.t < 120))
    toast(toolOk('gasstop') ? 'Párate junto a un balón con fuga' : 'Primero recoge el Gas Stop', '#ccc');
  S.gasT = 0;
}

// Explosión del balón: daña al bombero si está cerca
function explodeGas(pl) {
  const x = gasX(pl), y = pl.y - 22;
  pl.gas.state = 'boom';
  for (let i = 0; i < 90; i++) {
    const a = rand(0, Math.PI * 2), v = rand(1, 7);
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, g: 0.06, life: rand(25, 50), max: 50,
      c: ['#ff3d00', '#ff8c00', '#ffd23f', '#fff1a8'][i % 4], s: rand(4, 11) });
  }
  for (let k = 0; k < 8; k++) addSmoke(x + rand(-25, 25), y + rand(-20, 10), 'dark', 1.5);
  SFX.play('boom');
  if (Math.hypot(S.p.x - x, S.p.y - pl.y) < 150) {
    S.shake = 26; S.p.ground = null; S.p.vy = -6; S.p.vx = (S.p.x < x ? -1 : 1) * 6;
    hurt('¡El balón explotó! Usa el Gas Stop antes de 4 segundos', true);
  } else { S.shake = 10; toast('¡Un balón explotó!', '#ff8a8a'); }
}

// Balones de gas sobre los alféizares, con su cuenta regresiva
function drawGas() {
  for (const pl of S.plats) {

      ctx.restore();
    }
  }
}

// Si se quema en el aire, cae hasta el techo de abajo
function dyingFall() {
  const p = S.p;
  if (p.ground) return;
  const py = p.y;
  p.vy = Math.min(p.vy + 0.4, 12); p.y += p.vy;
  for (const pl of S.plats) {
    if (!pl.broken && !(pl.kind === 'stairstep' && !pl.bar.open) && py <= pl.y && p.y >= pl.y && p.x + 8 > pl.x && p.x - 8 < pl.x + pl.w) { p.y = pl.y; p.vy = 0; p.ground = pl; return; }
  }
  if (p.y > S.camY + H - 10 && S.lastSafe) { p.y = S.lastSafe.y; p.x = S.lastSafe.x + S.lastSafe.w / 2; p.vy = 0; p.ground = S.lastSafe; }
}

// Texturas de humo: bocanadas de bordes suaves y forma irregular, en varios tonos
const PUFF = {};
function makePuffs() {
  const tones = { dark: [84, 82, 86], mid: [118, 116, 122], light: [168, 168, 174], steam: [236, 240, 245] };
  for (const [k, [r, g, b]] of Object.entries(tones)) {
    PUFF[k] = [];
    for (let v = 0; v < 3; v++) {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const x = c.getContext('2d');
      for (let i = 0; i < 7; i++) {
        const px = 32 + rand(-12, 12), py = 32 + rand(-12, 12), pr = rand(12, 22);
        const gr = x.createRadialGradient(px, py, 0, px, py, pr);
        gr.addColorStop(0, `rgba(${r},${g},${b},0.72)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
        x.fillStyle = gr; x.beginPath(); x.arc(px, py, pr, 0, 7); x.fill();
      }
      PUFF[k].push(c);
    }
  }
}
makePuffs();

function addSmoke(x, y, kind, scale = 1) {
  if (S.smoke.length > 320) return;
  const steam = kind === 'steam';
  S.smoke.push({
    x, y, kind, v: Math.floor(Math.random() * 3),
    vx: rand(-0.25, 0.25), vy: steam ? rand(-1.3, -0.8) : rand(-0.75, -0.45),
    r: rand(6, 9) * scale, grow: (steam ? 0.32 : 0.3) * scale,
    rot: rand(0, 6.3), vr: rand(-0.02, 0.02), seed: rand(0, 100),
    age: 0, max: steam ? rand(45, 70) : rand(160, 220)
  });
}

function updateSmoke() {
  for (const m of S.smoke) {
    m.age++;
    m.x += m.vx + Math.sin(m.age / 22 + m.seed) * 0.28;   // se ondula al subir
    m.y += m.vy; m.vy *= 0.993;
    m.r += m.grow; m.grow *= 0.995;
    m.rot += m.vr;
  }
  S.smoke = S.smoke.filter(m => m.age < m.max);
}

function drawSmoke() {
  for (const m of S.smoke) {
    const k = m.age / m.max;
    const a = (k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85) * (m.kind === 'steam' ? 0.8 : 0.9);
    if (a <= 0) continue;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(m.x, m.y); ctx.rotate(m.rot);
    const d = m.r * 2.4;
    ctx.drawImage(PUFF[m.kind][m.v], -d / 2, -d / 2, d, d);
    ctx.restore();
  }
}

function updateParts() {
  for (const q of S.parts) { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; }
  S.parts = S.parts.filter(q => q.life > 0);
}

// ---------- Dibujo ----------
// Número pseudoaleatorio estable a partir de coordenadas (para ladrillos y adornos)
function hash(a, b) {
  const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return v - Math.floor(v);
}

// Tema visual del módulo actual ('tree' = árbol nocturno; null = edificio)
const theme = () => (MODS[S.mod] && MODS[S.mod].theme) || null;
const TRUNK_W = 58;   // ancho de cada tronco o pared de roca (uno a cada lado); las plataformas salen de ellos
const attachTheme = () => theme() === 'tree' || theme() === 'forest';
// Desde dónde salen las plataformas: el tronco en el árbol, el borde de la pantalla en el bosque
const wallW = () => theme() === 'forest' ? 0 : TRUNK_W;

// Números pseudoaleatorios con semilla (para que el dibujo prearmado sea siempre igual)
function seeded(n) { return () => { n |= 0; n = n + 0x6D2B79F5 | 0; let t = Math.imul(n ^ n >>> 15, 1 | n); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Una hoja con punta, rotada
function leafShape(x, cx, cy, len, ang) {
  x.save(); x.translate(cx, cy); x.rotate(ang);
  x.beginPath(); x.moveTo(-len / 2, 0);
  x.quadraticCurveTo(0, -len * 0.42, len / 2, 0); x.quadraticCurveTo(0, len * 0.42, -len / 2, 0);
  x.fill(); x.restore();
}

// Mata de follaje en capas: contorno, sombra, verdes medios, claros y brillo de luna arriba a la izquierda
function leafCluster(x, cx, cy, R, seed) {
  const rnd = seeded(seed * 977 + 13), pts = [];
  for (let i = 0; i < 120; i++) {
    const a = rnd() * Math.PI * 2, r = Math.pow(rnd(), 0.65) * R;
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.72, rnd() * Math.PI, 0.75 + rnd() * 0.5]);
  }
  const layer = (col, dx, dy, k, filter) => {
    x.fillStyle = col;
    for (const [px, py, a, s] of pts) if (!filter || filter(px - cx, py - cy)) leafShape(x, px + dx, py + dy, 20 * s * k, a);
  };
  layer('#07140a', 0, 2, 1.45);                                    // contorno oscuro
  layer('#143a17', 0, 3, 1.15);                                    // sombra de abajo
  layer('#24642a', 0, 0, 1.0);                                     // verde base
  layer('#3a8a34', -1, -2, 0.85, (dx, dy) => dy < R * 0.35);       // verde medio
  layer('#5aae44', -2, -4, 0.62, (dx, dy) => dy < 0 && dx < R * 0.5);   // verde claro
  layer('#9fd38a', -3, -6, 0.32, (dx, dy) => dy < -R * 0.25 && dx < 0); // brillo de la luna
}

// Arte del árbol prearmado una sola vez: corteza (textura que se repite) y matas de hojas
const TREE = {};
(function makeTreeArt() {
  const TH = 360;   // alto de la textura de corteza
  for (const side of ['L', 'R']) {
    const c = document.createElement('canvas'); c.width = TRUNK_W + 14; c.height = TH;
    const x = c.getContext('2d'), Wc = c.width, inner = side === 'L' ? Wc : 0, outer = Wc - inner;
    // madera: oscura hacia afuera, iluminada por la luna hacia el centro de la pantalla
    const g = x.createLinearGradient(outer, 0, inner, 0);
    g.addColorStop(0, '#1e1008'); g.addColorStop(0.45, '#4a2b16'); g.addColorStop(0.8, '#6e4325'); g.addColorStop(0.95, '#8a6046'); g.addColorStop(1, '#a3876f');
    x.fillStyle = g; x.fillRect(0, 0, Wc, TH);
    // placas de corteza: surcos ondulados (periódicos para que la textura no tenga costura)
    const wave = (i, y) => Math.sin(y / TH * Math.PI * 4 + i * 1.3) * 4 + Math.sin(y / TH * Math.PI * 10 + i) * 1.5;
    for (let i = 0; i < 7; i++) {
      const bx = 5 + i * (Wc - 10) / 6;
      x.strokeStyle = 'rgba(20,10,4,0.75)'; x.lineWidth = 2.5 + (i % 2);
      x.beginPath(); for (let y = 0; y <= TH; y += 6) { const xx = bx + wave(i, y); y ? x.lineTo(xx, y) : x.moveTo(xx, y); } x.stroke();
      x.strokeStyle = 'rgba(190,140,95,0.22)'; x.lineWidth = 1.2;   // borde iluminado de cada placa
      x.beginPath(); for (let y = 0; y <= TH; y += 6) { const xx = bx + 3 + wave(i, y); y ? x.lineTo(xx, y) : x.moveTo(xx, y); } x.stroke();
    }
    // grietas cortas
    const rnd = seeded(side === 'L' ? 5 : 9);
    for (let k = 0; k < 16; k++) {
      const cy = 10 + k * 21 + rnd() * 6, cx = 6 + rnd() * (Wc - 22);
      x.strokeStyle = 'rgba(20,10,4,0.6)'; x.lineWidth = 1.4;
      x.beginPath(); x.moveTo(cx, cy); x.quadraticCurveTo(cx + 6, cy + 3, cx + 12, cy + 1); x.stroke();
    }
    // musgo en el lado de afuera y un nudo con anillos
    for (let k = 0; k < 3; k++) {
      const my = 50 + k * 115, mx = side === 'L' ? Wc * 0.3 : Wc * 0.7;
      for (let n = 0; n < 14; n++) {
        x.fillStyle = ['#2f5d22', '#3f7a2a', '#58913a'][n % 3];
        x.beginPath(); x.arc(mx + (rnd() - 0.5) * 18, my + (rnd() - 0.5) * 28, 2 + rnd() * 3, 0, 7); x.fill();
      }
    }
    const kx = Wc / 2, ky = 230;
    x.fillStyle = '#1a0d05'; x.beginPath(); x.ellipse(kx, ky, 9, 13, 0, 0, 7); x.fill();
    x.strokeStyle = '#7a5032'; x.lineWidth = 1.5;
    for (const r of [4, 7, 10]) { x.beginPath(); x.ellipse(kx, ky, r * 0.7, r, 0, 0, 7); x.stroke(); }
    TREE['bark' + side] = c;
  }
  for (let v = 0; v < 6; v++) {
    const c = document.createElement('canvas'); c.width = 130; c.height = 110;
    leafCluster(c.getContext('2d'), 65, 58, 46, v);
    TREE['leaf' + v] = c;
  }
})();
const drawLeaves = (cx, cy, size, v) => { const im = TREE['leaf' + (((v % 6) + 6) % 6)]; ctx.drawImage(im, cx - size / 2, cy - size * 0.42, size, size * im.height / im.width); };

// Llama decorativa (lengua de fuego en capas)
function fireTongue(x, y, h, ph) {
  const f = Math.sin(S.t / 5 + ph) * h * 0.12, w = h * 0.38;
  for (const [col, k] of [['rgba(200,40,10,0.9)', 1], ['#ff7a1a', 0.75], ['#ffd23f', 0.42]]) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(x - w * k, y);
    ctx.quadraticCurveTo(x - w * k * 0.9, y - h * k * 0.55, x + f * k, y - h * k);
    ctx.quadraticCurveTo(x + w * k * 0.9, y - h * k * 0.5, x + w * k, y);
    ctx.fill();
  }
}

// Pino en silueta
function pineSil(x, y, h, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let k = 0; k < 4; k++) {
    const ty = y - h + k * h * 0.22, bw = h * (0.16 + k * 0.08);
    ctx.moveTo(x, ty); ctx.lineTo(x + bw, ty + h * 0.32); ctx.lineTo(x - bw, ty + h * 0.32);
  }
  ctx.fill(); ctx.fillRect(x - h * 0.03, y - h * 0.12, h * 0.06, h * 0.14);
}

// Fondo: cielo anaranjado con humo, montañas, bosque en capas con focos de fuego y brasas
function drawForestBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4a1a16'); g.addColorStop(0.35, '#8a2e1c'); g.addColorStop(0.7, '#c4521f'); g.addColorStop(1, '#a8431c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // humo espeso arriba
  for (let i = 0; i < 7; i++) {
    const cx = ((S.t * (0.1 + (i % 3) * 0.04) + i * 140) % (W + 320)) - 160, cy = 30 + (i % 4) * 55 - (S.camY * 0.02) % 40;
    ctx.fillStyle = `rgba(${40 + i * 4},${28 + i * 2},${28 + i * 2},${0.55 + (i % 2) * 0.15})`;
    for (const [dx, dy, r] of [[0, 0, 46], [44, -16, 38], [86, 2, 42], [-40, 10, 32], [120, 14, 28]]) { ctx.beginPath(); ctx.arc(cx + dx, cy + dy, r, 0, 7); ctx.fill(); }
  }
  // montaña al fondo
  const mo = -S.camY * 0.015;
  ctx.fillStyle = '#7a3324';
  ctx.beginPath(); ctx.moveTo(-20, H * 0.5 + mo); ctx.lineTo(W * 0.35, H * 0.3 + mo); ctx.lineTo(W * 0.55, H * 0.38 + mo); ctx.lineTo(W * 0.75, H * 0.22 + mo); ctx.lineTo(W + 20, H * 0.45 + mo); ctx.lineTo(W + 20, H); ctx.lineTo(-20, H); ctx.fill();
  // tres capas de bosque (lejos a cerca) con fuego entre los árboles
  const layers = [
    { y: H * 0.5, k: 0.02, h: 34, col: '#6a2a20', gap: 15, fire: 0.25 },
    { y: H * 0.68, k: 0.035, h: 52, col: '#4a1c16', gap: 22, fire: 0.35 },
    { y: H * 0.88, k: 0.05, h: 78, col: '#2a100c', gap: 32, fire: 0.3 },
  ];
  layers.forEach((L, li) => {
    const yb = L.y + ((-S.camY * L.k) % 60);
    ctx.fillStyle = L.col; ctx.fillRect(0, yb - 4, W, H - yb + 8);
    for (let i = -1; i < W / L.gap + 1; i++) {
      const x = i * L.gap + hash(i, li + 3) * L.gap * 0.6, h = L.h * (0.75 + hash(i, li + 5) * 0.5);
      pineSil(x, yb + 4, h, L.col);
      if (hash(i, li + 9) < L.fire) fireTongue(x + L.gap * 0.4, yb + 2, L.h * (0.45 + hash(i, li + 1) * 0.4), i + li);
    }
    // neblina de humo sobre cada capa
    const hz = ctx.createLinearGradient(0, yb - L.h, 0, yb + 20);
    hz.addColorStop(0, 'rgba(200,90,50,0)'); hz.addColorStop(1, 'rgba(200,90,50,0.22)');
    ctx.fillStyle = hz; ctx.fillRect(0, yb - L.h, W, L.h + 20);
  });
  // brasas que suben
  for (let i = 0; i < 50; i++) {
    const sp = 22 + (i % 7) * 10, x = (hash(i, 11) * W + Math.sin(S.t / 30 + i) * 14) % W;
    const y = H - ((S.t * sp / 60 + i * 61) % (H + 20));
    ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(S.t / 7 + i));
    ctx.fillStyle = i % 3 ? '#ff9a2e' : '#ffe066'; ctx.fillRect(x, y, 2 + (i % 2), 2 + (i % 2));
  }
  ctx.globalAlpha = 1;
}

// Rocas que caen: primero un aviso arriba (~0,9 s) y luego la roca cae girando; si golpea, quita una vida
const ROCK_WARN = 55;
function updateRocks() {
  const p = S.p, L = levelAt(p.y) || S.levels[0];
  if (!L || !L.rocks || S.goalPlaced && p.y < S.roofY + 10) return;
  if (--S.rockT <= 0) {
    S.rockT = Math.round(rand(L.rocks[0], L.rocks[1]));
    const x = Math.random() < 0.5 ? clamp(p.x + rand(-40, 40), 24, W - 24) : rand(24, W - 24);
    S.rockWarns.push({ x, t: ROCK_WARN, r: rand(12, 18) });
  }
  for (const w of S.rockWarns) {
    w.t--;
    if (w.t % 8 === 0) S.parts.push({ x: w.x + rand(-8, 8), y: S.camY + 40, vx: rand(-0.3, 0.3), vy: rand(2, 4), g: 0.25, life: 30, max: 30, c: '#5a4c46', s: rand(1.5, 2.8) });
    if (w.t <= 0) { S.rocks.push({ x: w.x, y: S.camY - 30, vy: 2, r: w.r, rot: 0, vr: rand(-0.12, 0.12), seed: Math.floor(rand(0, 90)) }); SFX.play('crumble'); }
  }
  S.rockWarns = S.rockWarns.filter(w => w.t > 0);
  for (const r of S.rocks) {
    r.vy = Math.min(10, r.vy + 0.28); r.y += r.vy; r.rot += r.vr;
    // choque con el bombero
    const dx = clamp(r.x, p.x - 10, p.x + 10) - r.x, dy = clamp(r.y, p.y - PH, p.y) - r.y;
    if (!r.hit && S.state === 'play' && dx * dx + dy * dy < r.r * r.r) {
      r.hit = true; shatterRock(r);
      if (S.inv <= 0) { S.p.vx = (p.x < r.x ? -1 : 1) * 4; hurt('¡Te golpeó una roca! Atento al aviso rojo'); }
    }
  }
  S.rocks = S.rocks.filter(r => !r.hit && r.y < S.camY + H + 60);
}

function shatterRock(r) {
  for (let k = 0; k < 18; k++) {
    const a = rand(0, Math.PI * 2), v = rand(1, 4);
    S.parts.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, g: 0.3, life: 40, max: 40, c: ['#4a4040', '#2e2725', '#6a5a52'][k % 3], s: rand(2, 4.5) });
  }
  SFX.play('crumble'); S.shake = Math.max(S.shake, 8);
}

// Roca angulosa con líneas de velocidad
function drawRocks() {
  for (const w of S.rockWarns) {   // aviso: "!" rojo parpadeante donde va a caer
    if (Math.floor(w.t / 6) % 2) continue;
    const y = S.camY + 54;
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.moveTo(w.x, y - 15); ctx.lineTo(w.x + 15, y + 11); ctx.lineTo(w.x - 15, y + 11); ctx.fill();
    ctx.fillStyle = '#ff3b2f'; ctx.beginPath(); ctx.moveTo(w.x, y - 11); ctx.lineTo(w.x + 11, y + 8); ctx.lineTo(w.x - 11, y + 8); ctx.fill();
    ctx.font = font(15); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText('!', w.x, y + 1);
  }
  for (const r of S.rocks) {
    ctx.strokeStyle = 'rgba(255,240,220,0.55)'; ctx.lineWidth = 1.5;   // líneas de movimiento
    ctx.beginPath();
    for (const o of [-0.5, 0, 0.5]) { ctx.moveTo(r.x + o * r.r, r.y - r.r - 6); ctx.lineTo(r.x + o * r.r, r.y - r.r - 6 - r.vy * 3.5); }
    ctx.stroke();
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    const poly = k => { ctx.beginPath(); for (let q = 0; q < 7; q++) { const a = q / 7 * Math.PI * 2, rr = r.r * k * (0.78 + hash(r.seed, q) * 0.35); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); };
    ctx.fillStyle = '#fff3e0'; poly(1.3); ctx.fill();   // contorno claro: se distingue de las rocas del acantilado
    ctx.fillStyle = '#0e0a0a'; poly(1.15); ctx.fill();
    ctx.fillStyle = '#7a6e6a'; poly(1); ctx.fill();
    ctx.fillStyle = '#a3958e'; ctx.save(); ctx.translate(-r.r * 0.2, -r.r * 0.25); poly(0.55); ctx.fill(); ctx.restore();
    ctx.fillStyle = 'rgba(255,170,100,0.35)'; ctx.beginPath(); ctx.ellipse(-r.r * 0.3, -r.r * 0.4, r.r * 0.25, r.r * 0.12, -0.5, 0, 7); ctx.fill();
    ctx.restore();
  }
}

// Cuerpo de roca del acantilado (se dibuja antes que el pasto de arriba, de arriba hacia abajo)
function drawCliffBody(pl) {
  const left = pl.side < 0, dir = left ? 1 : -1, y = pl.y;
  const xe = left ? -12 : W + 12, xt = left ? pl.x + pl.w : pl.x, len = Math.abs(xt - xe);
  const seed = Math.floor(Math.abs(pl.x * 11 + pl.y * 5)) % 89, depth = 150 + hash(seed, 2) * 60;
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(xe, y);
    ctx.lineTo(xt, y);
    ctx.quadraticCurveTo(xt + dir * 6, y + 14, xt - dir * 4, y + 26);                     // borde que sobresale
    ctx.quadraticCurveTo(xt - dir * len * 0.12, y + 60, xt - dir * len * 0.25, y + 92);   // se mete hacia adentro
    ctx.quadraticCurveTo(xt - dir * len * 0.3, y + depth * 0.8, xt - dir * len * 0.45, y + depth);
    ctx.lineTo(xe, y + depth + 30);
    ctx.closePath();
  };
  ctx.lineWidth = 5; ctx.strokeStyle = '#0e0a0a'; path(); ctx.stroke();
  const g = ctx.createLinearGradient(0, y, 0, y + depth);
  g.addColorStop(0, '#4a3e3a'); g.addColorStop(0.35, '#2e2725'); g.addColorStop(1, '#151110');
  ctx.fillStyle = g; path(); ctx.fill();
  ctx.save(); path(); ctx.clip();
  // bloques de roca con luz cálida del fuego en el borde exterior
  for (let k = 0; k < 7; k++) {
    const bx = xt - dir * (12 + hash(seed, k) * len * 0.7), by = y + 24 + hash(k, seed) * depth * 0.8, r = 12 + hash(seed + k, 3) * 16;
    // bloque anguloso: polígono irregular con cara de arriba iluminada
    const poly = (ox, oy, sc) => { ctx.beginPath(); for (let q = 0; q < 6; q++) { const a = q / 6 * Math.PI * 2 + hash(seed, k + q) * 0.5, rr = r * sc * (0.7 + hash(k, q + seed) * 0.4); ctx.lineTo(ox + Math.cos(a) * rr, oy + Math.sin(a) * rr * 0.8); } ctx.closePath(); };
    ctx.fillStyle = '#0e0a0a'; poly(bx + 1, by + 2, 1.12); ctx.fill();
    ctx.fillStyle = ['#3d3330', '#463a36', '#332b28'][k % 3]; poly(bx, by, 1); ctx.fill();
    ctx.fillStyle = 'rgba(255,150,80,0.15)'; poly(bx + dir * r * 0.15, by - r * 0.25, 0.55); ctx.fill();
  }
  // grietas verticales con brasas adentro
  for (let k = 0; k < 3; k++) {
    const cx = xt - dir * (16 + k * len * 0.22 + hash(seed, k + 4) * 10);
    ctx.strokeStyle = '#0e0a0a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx, y + 10);
    for (let q = 1; q <= 5; q++) ctx.lineTo(cx + Math.sin(q * 2 + k) * 5, y + 10 + q * depth * 0.15);
    ctx.stroke();
    if (hash(seed, k + 9) > 0.5) { ctx.fillStyle = `rgba(255,${120 + Math.sin(S.t / 8 + k) * 40},30,0.9)`; ctx.fillRect(cx - 1, y + 30 + k * 20, 3, 5); }
  }
  // borde del acantilado iluminado por el incendio
  ctx.strokeStyle = 'rgba(255,140,60,0.45)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(xt - dir * 2, y + 6); ctx.quadraticCurveTo(xt + dir * 2, y + 16, xt - dir * 4, y + 26); ctx.stroke();
  ctx.restore();
  // llamas que trepan por la cara de algunos acantilados
  if (seed % 3 === 0) for (let k = 0; k < 3; k++) fireTongue(xt - dir * (len * 0.25 + k * 12), y + 92 - k * 6, 26 + k * 6, seed + k);
}

// Árbol quemado sobre el acantilado (tronco negro sin hojas)
function deadTree(x, y, h, dir, seed) {
  const br = (x0, y0, a, l, w) => {
    const x1 = x0 + Math.cos(a) * l, y1 = y0 - Math.sin(a) * l;
    ctx.strokeStyle = '#0e0a0a'; ctx.lineWidth = w + 2; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.strokeStyle = '#2a1e1a'; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    return [x1, y1];
  };
  ctx.lineCap = 'round';
  const [tx, ty] = br(x, y, Math.PI / 2 + dir * 0.08, h, 6);
  for (let k = 0; k < 4; k++) {
    const f = 0.35 + k * 0.17, bx = x + (tx - x) * f, by = y + (ty - y) * f, side = k % 2 ? 1 : -1;
    const [ex, ey] = br(bx, by, Math.PI / 2 + side * (0.7 + hash(seed, k) * 0.4), h * (0.3 - k * 0.04), 3);
    br(ex, ey, Math.PI / 2 + side * 1.2, h * 0.1, 1.5);
  }
  ctx.strokeStyle = 'rgba(255,140,60,0.5)'; ctx.lineWidth = 1.5;   // filo iluminado
  ctx.beginPath(); ctx.moveTo(x + dir * 2, y); ctx.lineTo(tx + dir * 2, ty); ctx.stroke();
  ctx.lineCap = 'butt';
}

// Parte de arriba del acantilado: pasto dorado, arbustos, piedras, árbol quemado y algo de fuego
function drawLedge(pl) {
  const left = pl.side < 0, dir = left ? 1 : -1, y = pl.y;
  const xe = left ? -12 : W + 12, xt = left ? pl.x + pl.w : pl.x, len = Math.abs(xt - xe);
  const seed = Math.floor(Math.abs(pl.x * 11 + pl.y * 5)) % 89;
  const x0 = Math.min(xe, xt), x1 = Math.max(xe, xt);
  if (seed % 2 === 0) deadTree(xe + dir * (36 + hash(seed, 6) * 18), y, 80 + hash(seed, 7) * 50, dir, seed);
  // arbusto verde junto al borde (algunos ardiendo)
  drawLeaves(xe + dir * 44, y - 10, 58, seed);
  if (seed % 4 === 1) fireTongue(xe + dir * 44, y - 6, 34, seed);
  // piedra suelta arriba
  if (seed % 3 === 2) {
    const rx = xe + dir * (len * 0.45);
    ctx.fillStyle = '#0e0a0a'; ctx.beginPath(); ctx.ellipse(rx, y - 8, 15, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a4040'; ctx.beginPath(); ctx.ellipse(rx, y - 9, 13, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,170,100,0.3)'; ctx.beginPath(); ctx.ellipse(rx - 3, y - 13, 6, 3, 0, 0, 7); ctx.fill();
  }
  // capa de pasto dorado con mechones que cuelgan por el borde
  ctx.fillStyle = '#0e0a0a'; ctx.fillRect(x0, y - 4, x1 - x0, 10);
  const gg = ctx.createLinearGradient(0, y - 4, 0, y + 6);
  gg.addColorStop(0, '#f0c050'); gg.addColorStop(0.5, '#c8902e'); gg.addColorStop(1, '#7a4e1a');
  ctx.fillStyle = gg; ctx.fillRect(x0, y - 3, x1 - x0, 8);
  for (let x = x0; x < x1; x += 4) {
    const h = 4 + hash(x, seed) * 7;
    ctx.fillStyle = hash(x, 3) > 0.5 ? '#e8b84a' : '#b8822a';
    ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.lineTo(x + 2, y - 2 - h); ctx.lineTo(x + 4, y - 2); ctx.fill();
  }
  for (let k = 0; k < 3; k++) {   // mechones colgando en la punta
    const hx = xt - dir * (2 + k * 5);
    ctx.fillStyle = '#c8902e'; ctx.beginPath(); ctx.moveTo(hx - 2, y + 4); ctx.lineTo(hx, y + 12 + k * 2); ctx.lineTo(hx + 2, y + 4); ctx.fill();
  }
}

// Suelo del bosque al inicio
function drawForestGround() {
  ctx.fillStyle = '#0e0a0a'; ctx.fillRect(0, H - 24, W, 220);
  const g = ctx.createLinearGradient(0, H - 20, 0, H + 60);
  g.addColorStop(0, '#3a2a22'); g.addColorStop(1, '#120c0a');
  ctx.fillStyle = g; ctx.fillRect(0, H - 20, W, 220);
  const gg = ctx.createLinearGradient(0, H - 23, 0, H - 14);
  gg.addColorStop(0, '#f0c050'); gg.addColorStop(1, '#7a4e1a');
  ctx.fillStyle = gg; ctx.fillRect(0, H - 23, W, 8);
  for (let x = 0; x < W; x += 4) {
    const h = 4 + hash(x, 5) * 8;
    ctx.fillStyle = hash(x, 6) > 0.5 ? '#e8b84a' : '#b8822a';
    ctx.beginPath(); ctx.moveTo(x, H - 22); ctx.lineTo(x + 2, H - 22 - h); ctx.lineTo(x + 4, H - 22); ctx.fill();
  }
  deadTree(30, H - 22, 120, 1, 3); drawLeaves(W - 50, H - 34, 64, 4); fireTongue(W - 50, H - 26, 30, 2);
}

// Cima: meseta de lado a lado con pasto, árbol quemado y banderín
function drawSummit(pl) {
  ctx.fillStyle = '#0e0a0a'; ctx.fillRect(-20, pl.y - 4, W + 40, 60);
  const g = ctx.createLinearGradient(0, pl.y, 0, pl.y + 56);
  g.addColorStop(0, '#4a3e3a'); g.addColorStop(1, '#151110');
  ctx.fillStyle = g; ctx.fillRect(-20, pl.y + 4, W + 40, 52);
  deadTree(W - 40, pl.y, 110, -1, 7);
  const gg = ctx.createLinearGradient(0, pl.y - 3, 0, pl.y + 6);
  gg.addColorStop(0, '#f0c050'); gg.addColorStop(1, '#7a4e1a');
  ctx.fillStyle = gg; ctx.fillRect(-20, pl.y - 3, W + 40, 8);
  for (let x = 0; x < W; x += 4) {
    const h = 4 + hash(x, 8) * 8;
    ctx.fillStyle = hash(x, 9) > 0.5 ? '#e8b84a' : '#b8822a';
    ctx.beginPath(); ctx.moveTo(x, pl.y - 2); ctx.lineTo(x + 2, pl.y - 2 - h); ctx.lineTo(x + 4, pl.y - 2); ctx.fill();
  }
